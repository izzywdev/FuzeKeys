name: Registration init-container tests

# register.sh runs in an INIT CONTAINER built on curlimages/curl — busybox + sh +
# curl, and nothing else. Nothing in CI ran it before, which is how a hard
# dependency on jq (absent from that image) shipped to production: the container
# died at preflight, before contacting the registry, and the pod CrashLoopBackOff'd
# with a failure indistinguishable from a bad token.
#
# These tests run the real script against a mock registry on a PATH restricted to
# the image's toolset, so a reintroduced dependency fails here rather than at deploy.

on:
  push:
    paths:
      - 'registration/**'
      - '.github/workflows/registration-test.yml'
  pull_request:
    paths:
      - 'registration/**'
      - '.github/workflows/registration-test.yml'

permissions:
  contents: read

jobs:
  registration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # NOT `|| true`. The point of this job is to fail when register.sh cannot run
      # on the image it is actually deployed on.
      - name: Run registration tests
        run: bash registration/__tests__/run.sh
