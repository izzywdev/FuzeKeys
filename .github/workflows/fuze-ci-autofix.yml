# fuze:managed template=fuze-ci-autofix.yml baseline=v1 digest=sha256:586e8d6c24923efb42b62be2980fe91881189a212614b3e85afd280b5cc5c9e4
name: Fuze Auto-Fix CI

# RENAMED from claude-ci-autofix.yml (the claude-* -> fuze-* fleet rename; see
# claude.yml/fuze.yml, claude-auto-pr.yml/fuze-auto-pr.yml). This one was a straight
# rename, not a permanent dual-track split like those pairs.
#
# SELF-CONTAINED (inlined) as of the FuzeSDLC#758 fix. This job used to be a `uses:`
# call into izzywdev/FuzeSDLC's reusable-claude-ci-autofix.yml. A PUBLIC repo cannot
# resolve a reusable workflow hosted in a PRIVATE repo -- FuzeSDLC is private -- so on
# every oss-public consumer (FuzeInfra, FuzeFront, FuzeAgent, FuzeKeys, FuzeX) this
# call failed at STARTUP ("workflow was not found") and auto-fix had never run once.
# Inlined so the fleet distributes by governance-sync COPY instead of cross-repo
# reference: FuzeSDLC stays the one place to edit this job, and every repo now
# carries a runnable copy regardless of its own visibility or the hub's. See
# governance/reusable-workflows.md for the full decision and the fate of the
# (still-hosted, now-legacy) reusable-claude-ci-autofix.yml.
#
# It still calls `./.github/actions/fuze-code-action` (PR #196) -- that composite
# action (and the `llm-endpoint` action it wraps) travels to every repo unconditionally
# via scripts/bootstrap/caps/workflows.py's ACTIONS tuple.
#
# TWO PATHS, BRANCHED ON `github.event.workflow_run.name`:
#
#   * SEPARATE-PR PATH (job `call-autofix`) — for "Harden Gate" / "Infrastructure
#     Tests" / "Helm Chart Validation". UNCHANGED: it opens a throwaway
#     `claude-auto-fix-ci-*` branch and a NEW PR, and NEVER pushes to the PR under
#     repair. The `claude-auto-fix-ci-` branch-name guard is the loop guard that stops
#     an auto-fix failure from triggering another auto-fix (FuzeInfra was once bitten by
#     a 691-comment self-trigger loop). Do not remove or rename it without keeping it in
#     lockstep with the branch prefix it generates.
#
#   * REVIEW LOOP PATH (job `review-loop`) — for "Fuze Code Review". The owner's mandate:
#     "fuze-ci-autofix must be triggered in a LOOP with code-review until the PR is
#     approved." This job fixes NOTHING itself: it DISPATCHES the shared `fuze.yml`
#     (workflow_dispatch) with the reviewer's findings, so the fleet has ONE fixer -- the
#     same handler a human `@fuze` reaches, with the same trusted-actions pinning, coder
#     identity and failure alerting. fuze.yml checks out the PR's OWN head branch, fixes
#     exactly what the reviewer flagged, and pushes the fix BACK to that head branch under
#     its fuze-agent App identity, so the push re-triggers fuze-code-review (`synchronize`),
#     which re-reviews, which -- if still not approved -- re-triggers this loop, until the
#     review approves (and auto-merge takes the PR) or the round CAP is hit. It is bounded
#     three ways:
#       - MAX ROUNDS (FUZE_AUTOFIX_MAX_ROUNDS, default 3): the larger of (a) `[fuze-autofix-
#         round]`-marked commits on the head branch and (b) this job's own dispatch-marker
#         comments on the PR. (b) is the one that cannot be defeated by the fixer forgetting
#         the commit marker; if it cannot be counted the loop stops (fails closed). At the
#         cap it comments and STOPS.
#       - GENUINE ABSTAIN: if the latest review is an abstain (no actionable findings —
#         a review that could not run, not a set of fixes), there is nothing to fix, so
#         it comments "human needed" and stops rather than thrashing.
#       - SENSITIVE PATHS: a PR touching the approval machinery / governance surface is
#         human-gated anyway and an App often cannot push workflow changes, so the loop
#         does not attempt the auto-push there — it comments and stops.
#     A CREDIT OUTAGE never reaches this path: an availability outage PASSES the review
#     check (scripts/fuze_code_review_verdict.py rule 8), so the workflow_run conclusion
#     is `success` and neither job's `if` fires. autofix never triggers autofix: this job
#     triggers only on a fuze-code-review `workflow_run`, never on its own push.

on:
  workflow_run:
    workflows: ["Infrastructure Tests", "Helm Chart Validation", "Harden Gate", "Fuze Code Review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  id-token: write

# The bounded-loop cap for the review-loop path. Greppable, workflow-level, one place to
# change. Counted from `[fuze-autofix-round]`-marked commits on the PR head branch.
env:
  FUZE_AUTOFIX_MAX_ROUNDS: '3'

jobs:
  call-autofix:
    # SEPARATE-PR PATH — Harden Gate / Infrastructure Tests / Helm Chart Validation only.
    # Explicitly NOT "Fuze Code Review": that has its own loop path below, and letting it
    # fall in here would open a throwaway PR instead of pushing the fix into the loop.
    if: >-
      ${{ github.event.workflow_run.name != 'Fuze Code Review' &&
          github.event.workflow_run.conclusion == 'failure' &&
          !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-') &&
          github.event.workflow_run.head_branch != 'master' }}
    # Rewritten by the installer to this repo's ci.runner (render.py) via the same
    # generic `runs-on: ubuntu-latest` substitution every other STAMPED workflow gets.
    runs-on: ubuntu-latest
    steps:
      # Preflight: run auto-fix only when at least one LLM key is configured on this repo.
      - name: Preflight — is any LLM key configured?
        id: keys
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          LITELLM: ${{ secrets.LITELLM_FUZE_KEY }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC}" ] || [ -n "${LITELLM}" ] || [ -n "${OPENAI}" ] || [ -n "${GEMINI}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM key (ANTHROPIC_API_KEY / LITELLM_FUZE_KEY / OPENAI_API_KEY / GEMINI_API_KEY) configured on ${{ github.repository }} — skipping Claude CI auto-fix (not a failure)."
          fi

      - name: Checkout PR head branch
        if: steps.keys.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        if: steps.keys.outputs.present == 'true'
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Create fix branch
        id: branch
        if: steps.keys.outputs.present == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$HEAD_BRANCH" | tr -cd 'a-zA-Z0-9/_.-')
          BRANCH_NAME="claude-auto-fix-ci-${SAFE_BRANCH}-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Gather CI failure logs
        id: failure_details
        if: steps.keys.outputs.present == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # Passed through env, NOT interpolated into the script body. `${{ ... }}`
          # is substituted as raw text BEFORE the JS is parsed, so an input carrying
          # a quote would escape the string literal and execute as code.
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const run_id = Number(process.env.RUN_ID);
            if (!Number.isInteger(run_id)) {
              core.setFailed(`run_id is not an integer: ${process.env.RUN_ID}`);
              return;
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
            });
            const failed = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            let combined = "";
            for (const job of failed) {
              try {
                const res = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                const text = typeof res.data === 'string' ? res.data : String(res.data);
                const tail = text.slice(-4000);
                combined += `\n===== Job: ${job.name} =====\n${tail}\n`;
              } catch (e) {
                combined += `\n===== Job: ${job.name} (log download failed: ${e.message}) =====\n`;
              }
            }
            return {
              failedJobs: failed.map(j => j.name),
              logs: combined.slice(-12000),
            };

      # NOTE ON PROMPT INJECTION: the CI logs below are attacker-influenceable --
      # anyone who can open a PR can make a build print arbitrary text into them.
      # Bounded rather than eliminated: --allowedTools is an explicit allow-list with
      # no arbitrary Bash, the work happens on a throwaway claude-auto-fix-ci-* branch,
      # and the result is a PR a human reviews -- never a push to the PR under repair.
      - name: Fix CI failures with Claude
        if: steps.keys.outputs.present == 'true'
        uses: ./.github/actions/fuze-code-action
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          claude-args: >-
            --model claude-sonnet-4-6
            --allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(pnpm:*),Bash(python:*),Bash(pip:*),Bash(php:*),Bash(composer:*)'
          task-prompt: |
            A CI run failed on a pull request in this repository. You are checked out on a
            fresh branch created from the PR's head branch. Investigate and fix the failures.

            Repository: ${{ github.repository }}
            Failing pull request: #${{ github.event.workflow_run.pull_requests[0].number || '' }}
            Original PR head branch: ${{ github.event.workflow_run.head_branch }}
            Your working branch (already checked out): ${{ steps.branch.outputs.branch_name }}
            Failed CI run: ${{ github.event.workflow_run.html_url }}
            Failed jobs: ${{ join(fromJSON(steps.failure_details.outputs.result).failedJobs, ', ') }}

            Error logs (tail, truncated):
            ${{ fromJSON(steps.failure_details.outputs.result).logs }}

            Instructions:
            1. Diagnose the root cause of the CI failure from the logs above and the code.
            2. Make the minimal, targeted changes needed to make CI pass. Do not touch
               unrelated code, CI secrets, or workflow files unless that is the actual cause.
            3. Commit your changes to the current branch
               (${{ steps.branch.outputs.branch_name }}) and push it with `git push -u origin HEAD`.
            4. Open a pull request from your branch targeting "${{ github.event.workflow_run.head_branch }}"
               using `gh pr create`, summarizing the root cause and the fix, and reference
               PR #${{ github.event.workflow_run.pull_requests[0].number || '' }} in the body.
            If you cannot determine a safe fix, push nothing and instead leave a comment on
            PR #${{ github.event.workflow_run.pull_requests[0].number || '' }} explaining what you found.
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          litellm-ci-key: ${{ secrets.LITELLM_CI_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}

  review-loop:
    # REVIEW LOOP PATH — "Fuze Code Review" only. Dispatch the shared fuze.yml to fix what
    # the reviewer flagged on the PR head branch so fuze-code-review re-reviews it, bounded
    # by FUZE_AUTOFIX_MAX_ROUNDS. The `claude-auto-fix-ci-` guard keeps the separate-PR
    # path's branches out of this loop; the default-branch guard is unchanged.
    if: >-
      ${{ github.event.workflow_run.name == 'Fuze Code Review' &&
          github.event.workflow_run.conclusion == 'failure' &&
          !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-') &&
          github.event.workflow_run.head_branch != 'master' &&
          github.event.workflow_run.head_branch != 'main' }}
    # `actions: write` is what lets GITHUB_TOKEN `workflow_dispatch` fuze.yml (a dispatch is
    # exempt from the no-recursion rule for GITHUB_TOKEN events). Job-level permissions
    # REPLACE the workflow-level block, so the rest is restated.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — is any LLM key configured?
        id: keys
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          LITELLM: ${{ secrets.LITELLM_FUZE_KEY }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC}" ] || [ -n "${LITELLM}" ] || [ -n "${OPENAI}" ] || [ -n "${GEMINI}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM key configured on ${{ github.repository }} — skipping fuze-code-review auto-fix loop (not a failure)."
          fi

      - name: Resolve the PR number under repair
        id: pr
        if: steps.keys.outputs.present == 'true'
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::no pull_request attached to this fuze-code-review run — nothing to loop on."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # CI-triggering identity. A GITHUB_TOKEN push triggers NO downstream workflows, so a
      # fix pushed with it would NOT re-run fuze-code-review and the loop would silently
      # stall. Mint a fuze-agent App token (fall back App -> bot PAT -> GITHUB_TOKEN, the
      # last warning that the loop will not re-trigger). Same pattern as fuze-auto-pr.yml.
      - name: Mint fuze-agent App token
        id: app_token
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FUZE_AGENT_APP_ID }}
          private-key: ${{ secrets.FUZE_AGENT_APP_PRIVATE_KEY }}

      - name: Resolve push identity
        id: identity
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          BOT_PAT: ${{ secrets.GH_RELEASE_PAT }}
          GH_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${APP_TOKEN:-}" ]; then
            tok="$APP_TOKEN"; who="fuze-agent (App installation token)"; triggers_ci=true
          elif [ -n "${BOT_PAT:-}" ]; then
            tok="$BOT_PAT"; who="GH_RELEASE_PAT (bot PAT)"; triggers_ci=true
          else
            tok="$GH_DEFAULT"; who="GITHUB_TOKEN"; triggers_ci=false
            echo "::warning title=autofix-identity::No FUZE_AGENT_APP_* App secrets and no GH_RELEASE_PAT — a fix pushed as GITHUB_TOKEN will NOT re-trigger fuze-code-review, so the loop cannot continue. Set the fuze-agent App secrets to fix."
          fi
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
          echo "triggers_ci=$triggers_ci" >> "$GITHUB_OUTPUT"
          echo "Push identity: $who"

      - name: Checkout PR head branch
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.identity.outputs.token }}

      - name: Configure git identity
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true'
        run: |
          git config user.email "claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"

      # LOOP GUARD 1 — SENSITIVE PATHS. A PR touching the approval machinery / governance
      # surface is human-gated regardless (fuze-code-review downgrades it to comment-only),
      # and the fuze-agent App often cannot push .github/workflows changes anyway. Do not
      # attempt the auto-push loop there — comment and stop.
      - name: Guard — sensitive paths are human-gated (no auto-push loop)
        id: sensitive
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref || 'main' }}
        run: |
          set -uo pipefail
          git fetch origin "$BASE_REF" --depth=1 || true
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/loop_changed.txt 2>/dev/null || true
          SENSITIVE_PATTERN='^(\.github/workflows/|\.github/actions/|workflow-templates/|governance/|scripts/apply_ruleset\.sh$|scripts/bootstrap/)'
          if grep -Eq "$SENSITIVE_PATTERN" /tmp/loop_changed.txt; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "🤖 fuze-code-review auto-fix loop: this PR changes the approval machinery / governance surface, which is human-gated (fuze-code-review is comment-only here and the app cannot self-push workflow changes). Not attempting an auto-fix push — a human is needed."
            echo "::notice::sensitive-path PR — auto-fix loop not attempted."
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      # LOOP GUARD 2 — MAX-ROUND CAP. Count `[fuze-autofix-round]`-marked commits already on
      # the head branch; at the cap, comment once and STOP (prevents runaway cost/thrash).
      - name: Guard — max-round cap
        id: cap
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true' && steps.sensitive.outputs.sensitive == 'false'
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MAX_ROUNDS: ${{ env.FUZE_AUTOFIX_MAX_ROUNDS }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref || 'main' }}
        run: |
          set -uo pipefail
          # Count ONLY the autofix rounds unique to THIS PR branch. With fetch-depth 0,
          # `git log HEAD` traverses ALL reachable history, so a [fuze-autofix-round]-marked
          # commit that reached the base branch (a non-squash merge of a previously
          # auto-fixed PR, or a squash whose concatenated body carried the marker) would be
          # counted too, inflating ROUNDS and potentially firing the cap before the first fix
          # round of a new PR. Scope to origin/BASE_REF..HEAD; re-fetch the base defensively
          # (the sensitive-path guard above already fetched it) and fall back to the full log
          # only if the base ref is somehow absent.
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            ROUNDS=$(git log "origin/${BASE_REF}..HEAD" --format=%s | grep -cF '[fuze-autofix-round]' || true)
          else
            ROUNDS=$(git log --format=%s | grep -cF '[fuze-autofix-round]' || true)
          fi
          # Second, independent counter: the dispatch markers THIS job posts. The commit marker
          # above depends on the fixer (fuze.yml's agent) putting it in its commit message; this
          # one does not, so the cap holds even when the fixer forgets it. Counting can fail
          # (API error): that is treated as "cap reached", never as zero.
          if DISPATCH_COUNTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
                --jq '[.[] | select(.body | contains("<!-- fuze-review-fix-dispatch -->"))] | length'); then
            DISPATCHES=$(printf '%s\n' "$DISPATCH_COUNTS" | awk '{s+=$1} END{print s+0}')
          else
            echo "::warning::could not count prior dispatches on #${PR_NUMBER} - failing closed (treating the cap as reached)."
            DISPATCHES="${MAX_ROUNDS}"
          fi
          if [ "${DISPATCHES}" -gt "${ROUNDS}" ]; then ROUNDS="${DISPATCHES}"; fi
          NEXT=$((ROUNDS + 1))
          echo "rounds so far: ${ROUNDS}; cap: ${MAX_ROUNDS}"
          if [ "${ROUNDS}" -ge "${MAX_ROUNDS}" ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "🤖 fuze-code-review auto-fix loop: reached the cap of ${MAX_ROUNDS} auto-fix round(s) without an approving review. Stopping to avoid a runaway loop — a human review is needed."
            echo "::warning::auto-fix loop cap (${MAX_ROUNDS}) reached — stopping."
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
            echo "next_round=${NEXT}" >> "$GITHUB_OUTPUT"
          fi

      # Fetch the latest fuze-code-review verdict so the fix targets exactly what was
      # flagged — AND distinguish a genuine ABSTAIN (a review that could not run: nothing
      # to fix, do not thrash) from real findings.
      - name: Fetch the reviewer's findings
        id: findings
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true' && steps.sensitive.outputs.sensitive == 'false' && steps.cap.outputs.capped == 'false'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const HEADER = "fuze-code-review — automated verdict";
            const ABSTAIN = "No verdict was reached";
            // Every outage body (passing or blocking) carries this marker: no review was
            // performed, so there are no findings to act on.
            const OUTAGE = "<!-- fuze-code-review-outage -->";
            // Reviews (request_changes / commented) carry the findings; the abstain path
            // posts an issue COMMENT instead. Look at both, newest first.
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo, pull_number, per_page: 100,
            });
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pull_number, per_page: 100,
            });
            const ours = [];
            for (const r of reviews.data) {
              if (r.body && r.body.includes(HEADER)) ours.push({ when: r.submitted_at, body: r.body });
            }
            for (const c of comments.data) {
              if (c.body && c.body.includes(HEADER)) ours.push({ when: c.created_at, body: c.body });
            }
            ours.sort((a, b) => new Date(a.when) - new Date(b.when));
            const latest = ours.length ? ours[ours.length - 1] : null;
            if (!latest) {
              core.setOutput("actionable", "false");
              core.setOutput("findings", "");
              return;
            }
            // A genuine abstain / deferral / outage is NOT a set of fixes — there is
            // nothing in the PR to change, so do not thrash the loop on it.
            const actionable = !latest.body.includes(ABSTAIN) && !latest.body.includes(OUTAGE);
            core.setOutput("actionable", actionable ? "true" : "false");
            core.setOutput("findings", latest.body.slice(0, 8000));

      - name: Stop — nothing actionable to fix (genuine abstain)
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true' && steps.sensitive.outputs.sensitive == 'false' && steps.cap.outputs.capped == 'false' && steps.findings.outputs.actionable != 'true'
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🤖 fuze-code-review auto-fix loop: the latest review did not produce actionable findings (it abstained, or NO REVIEW WAS PERFORMED on a provider outage — there is nothing to auto-fix). A human is needed."
          echo "::notice::latest review is a genuine abstain — no auto-fix attempted."

      # Hand the findings to the ONE shared fixer. fuze.yml owns the checkout, the trusted-
      # actions pinning, the coder identity, the model run, the push and the failure alert;
      # this job only decides WHETHER another round is allowed (the guards above) and passes
      # the verdict. The dispatch-marker comment is posted FIRST so a round is counted even if
      # the dispatch itself then fails. It deliberately contains no `@fuze` and carries the
      # loop-guard sentinel, so it can never itself invoke the mention handler.
      - name: Dispatch the shared @fuze fixer (fuze.yml)
        if: steps.keys.outputs.present == 'true' && steps.pr.outputs.found == 'true' && steps.sensitive.outputs.sensitive == 'false' && steps.cap.outputs.capped == 'false' && steps.findings.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEXT_ROUND: ${{ steps.cap.outputs.next_round }}
          MAX_ROUNDS: ${{ env.FUZE_AUTOFIX_MAX_ROUNDS }}
          REF: ${{ github.event.repository.default_branch }}
          CLUSTER_ENTRYPOINT: ${{ vars.FUZE_CLUSTER_ENTRYPOINT }}
          FINDINGS: ${{ steps.findings.outputs.findings }}
        run: |
          set -uo pipefail
          if [ "${CLUSTER_ENTRYPOINT:-}" = "true" ]; then
            # fuze.yml stands down in a repo that runs the cluster-capable entrypoint, so a
            # dispatch would start a run that skips every step. Say so instead.
            gh pr comment "$PR_NUMBER" --body "🤖 fuze-code-review auto-fix loop: this repo runs the cluster-capable entrypoint (FUZE_CLUSTER_ENTRYPOINT=true), which has no automated review-fix entry. A human is needed."
            echo "::warning::FUZE_CLUSTER_ENTRYPOINT=true - fuze.yml would not run; not dispatching."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body "<!-- fuze-review-fix-dispatch -->
          <!-- fuze-loop-guard: automated dispatch notice - this comment must NOT re-trigger the Fuze workflow -->
          🤖 fuze-code-review auto-fix loop (round ${NEXT_ROUND}/${MAX_ROUNDS}): dispatching the shared fuze.yml fixer with the reviewer's findings."
          if ! gh workflow run fuze.yml --repo "$REPO" --ref "$REF" \
                 -f pr_number="$PR_NUMBER" -f round="$NEXT_ROUND" -f findings="$FINDINGS"; then
            gh pr comment "$PR_NUMBER" --body "🤖 fuze-code-review auto-fix loop (round ${NEXT_ROUND}/${MAX_ROUNDS}): could not dispatch fuze.yml (is it installed on the default branch, and does this workflow have actions: write?). A human is needed."
            echo "::error::workflow dispatch of fuze.yml failed"
            exit 1
          fi
          echo "::notice::dispatched fuze.yml for PR #${PR_NUMBER} (round ${NEXT_ROUND}/${MAX_ROUNDS}); its push re-triggers fuze-code-review and the loop continues until approval or the cap."
