# fuze:managed template=claude.yml baseline=main digest=sha256:de7a215a2824648f82152cf2bbdc8476f2c1852cfa1acd9a4ab989d880eb5420
name: Claude

# Lets maintainers delegate work to Claude by mentioning @claude in an issue,
# issue comment, PR, or review comment. Claude reads the thread + repo and
# responds / pushes a claude/** branch. The companion `claude-auto-pr.yml`
# workflow then opens a draft PR from that branch (issue -> PR autonomy).
#
# LLM credential: routed through .github/actions/llm-endpoint (LiteLLM in-cluster with
# automatic fallback to a direct vendor — see that action for the design). Requires repo
# secret LITELLM_FUZE_KEY and/or ANTHROPIC_API_KEY (at least one).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout PR branch (when triggered from a PR)
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        # Every `github` context value reaches the shell through env:, never through
        # `${{ }}` inside run:. A branch name is attacker-controlled and git permits `;`,
        # `|`, `$`, `"` and backticks in a ref, so an interpolated head.ref executes on the
        # runner with the job's token in scope — the documented GitHub Actions script
        # injection. actionlint flags it as `expression`, semgrep as run-shell-injection.
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.sha)
            HEAD_REF=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.ref)
          else
            HEAD_SHA="$PR_HEAD_SHA"
            HEAD_REF="$PR_HEAD_REF"
          fi
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
          echo "Checked out PR branch: $HEAD_REF @ $HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Claude
        uses: ./.github/actions/fuze-code-action
        with:
          anthropic-api-key: ${{ steps.llm.outputs.auth-token }}
          show-full-output: true
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
