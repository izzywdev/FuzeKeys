# fuze:managed template=claude.yml baseline=v1 digest=sha256:514cd27df255a79f6aaa9a8f180e83765324800e8bd98075478c0eda6e6bbaff
name: Claude

# Lets maintainers delegate work to Claude by mentioning @claude in an issue,
# issue comment, PR, or review comment. Claude reads the thread + repo and
# responds / pushes a claude/** branch. The companion `fuze-auto-pr.yml`
# workflow then opens a draft PR from that branch (issue -> PR autonomy).
#
# LLM credential: routed through .github/actions/llm-endpoint (LiteLLM in-cluster with
# automatic fallback to a direct vendor — see that action for the design). Requires repo
# secret LITELLM_FUZE_KEY and/or ANTHROPIC_API_KEY (at least one).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout PR branch (when triggered from a PR)
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        # Every `github` context value reaches the shell through env:, never through
        # `${{ }}` inside run:. A branch name is attacker-controlled and git permits `;`,
        # `|`, `$`, `"` and backticks in a ref, so an interpolated head.ref executes on the
        # runner with the job's token in scope — the documented GitHub Actions script
        # injection. actionlint flags it as `expression`, semgrep as run-shell-injection.
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.sha)
            HEAD_REF=$(gh api "repos/${REPO}/pulls/${PR_NUM}" --jq .head.ref)
          else
            HEAD_SHA="$PR_HEAD_SHA"
            HEAD_REF="$PR_HEAD_REF"
          fi
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
          echo "Checked out PR branch: $HEAD_REF @ $HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # CODER IDENTITY (docs/identity-and-roles.md). Prefer the least-privilege `fuzeoneagent`
      # collaborator token as the coding/commit/push credential when provisioned; fall back to
      # today's GITHUB_TOKEN with a ::warning:: when unset, so an un-provisioned repo degrades
      # rather than breaks (passing GITHUB_TOKEN explicitly is behaviourally identical to the
      # prior default of letting claude-code-action read it from the environment). When the
      # token IS set, stamp the git author as fuzeoneagent — repo-local `git config` persists
      # into the fuze-code-action composite steps in this same job. Least privilege: @claude
      # coding must never run as the admin `izzywdev` identity.
      # fuze:secret-sourcing FUZEONEAGENT_TOKEN=fleet — provision-secrets.yml (FLEET_SOURCED); least-privilege coder identity
      - name: Resolve coding identity (fuzeoneagent when its token is set)
        id: coder
        env:
          CODER_TOKEN: ${{ secrets.FUZEONEAGENT_TOKEN }}
          GH_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${CODER_TOKEN:-}" ]; then
            tok="$CODER_TOKEN"
            who="fuzeoneagent (FUZEONEAGENT_TOKEN — least-privilege coder)"
            git config user.name "fuzeoneagent"
            git config user.email "330369996+fuzeoneagent@users.noreply.github.com"
          else
            tok="$GH_DEFAULT"
            who="GITHUB_TOKEN (default — FUZEONEAGENT_TOKEN unset)"
            echo "::warning title=coder-identity::FUZEONEAGENT_TOKEN is unset on this repo — @claude codes/commits/pushes under the default GITHUB_TOKEN identity, exactly as before. Set FUZEONEAGENT_TOKEN to author as the least-privilege coder account (docs/identity-and-roles.md)."
          fi
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
          echo "Coding identity: $who"

      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Claude
        uses: ./.github/actions/fuze-code-action
        with:
          # Coder credential: fuzeoneagent when provisioned, else GITHUB_TOKEN (see the
          # Resolve coding identity step — default-safe when FUZEONEAGENT_TOKEN is unset).
          github-token: ${{ steps.coder.outputs.token }}
          anthropic-api-key: ${{ steps.llm.outputs.auth-token }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show-full-output: true
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          litellm-ci-key: ${{ secrets.LITELLM_CI_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
