# fuze:managed template=telegram-pr-merged.yml baseline=main digest=sha256:06312649f4369d186e7b6cec548436d02788a6f559ec3aee44c312b3672cc5ad
name: Notify Telegram on PR merge

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    uses: izzywdev/FuzeSDLC/.github/workflows/reusable-telegram-pr-merged.yml@main
    with:
      pr_title: ${{ github.event.pull_request.title }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_number: ${{ github.event.pull_request.number }}
      repository: ${{ github.repository }}
      merged_by: ${{ github.event.pull_request.merged_by.login }}
      base_branch: ${{ github.event.pull_request.base.ref }}
      # Rewritten by the installer to this repo's ci.runner (render.py). The called
      # job runs in THIS repo's context and bills to it, so leaving it on
      # ubuntu-latest puts one job back on a GitHub-hosted machine -- and on a
      # private repo, never runs it at all.
      runner: ubuntu-latest
    secrets: inherit