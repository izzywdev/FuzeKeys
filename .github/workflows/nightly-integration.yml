# fuze:managed template=nightly-integration.yml baseline=v1 digest=sha256:0ee895cda90ae069cc1ff4f96d93732a7d2899f1116967b426918787bd06e1da
name: Nightly Integration

# ADLC govern-loop, integration arm (sibling of governance-nightly.yml).
# Each night: stand the repo up in its BOUNDED local environment (vendored FuzeInfra
# consumer-test stack + external-service mocks, no prod egress) and run its integration/
# contract suite. On failure -> Claude opens a loop-guarded DRAFT fix PR + tracking issue
# (NEVER auto-merges). Where no suite / bounded local-up exists yet, the job no-ops GREEN
# and files ONE idempotent @fuze issue to build it (self-propagating adoption).
#
# LLM credential (autofix job): routed through .github/actions/llm-endpoint (LiteLLM
# in-cluster with automatic fallback to a direct vendor). Requires repo secret
# LITELLM_FUZE_KEY and/or ANTHROPIC_API_KEY (at least one). Reuses the gate-localup mechanism
# (governance/local-environment.md). Install with a per-repo staggered cron minute.

on:
  schedule:
    - cron: '28 7 * * *'   # fuze:spread-cron — off-peak; minute/hour are derived per repo at install time so the fleet does not fire together
  workflow_dispatch:        # manual run

permissions:
  contents: write           # open fix branches/PRs
  pull-requests: write      # draft fix PR
  issues: write             # tracking issue + @fuze build issue
  actions: read             # read the failed run for diagnosis
  id-token: write           # claude-code-action OIDC

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ran: ${{ steps.detect.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect bounded local-up + integration suite
        id: detect
        shell: bash
        run: |
          set -e
          CT=$(git ls-files '**/docker-compose.consumer-test.yml' 'docker-compose.consumer-test.yml' | head -1)
          SUITE=""
          if [ -f package.json ] && grep -qE '"(test:integration|test:e2e)"[[:space:]]*:' package.json; then SUITE="npm"; fi
          if [ -z "$SUITE" ] && { git ls-files 'tests/integration/**' '**/tests/integration/**' | grep -q . || grep -rqs "pytest.mark.integration" --include='*.py' .; }; then SUITE="pytest"; fi
          if [ -z "$SUITE" ] && [ -f .fuze/manifest.json ] && grep -q '"integrationTest"' .fuze/manifest.json; then SUITE="manifest"; fi
          # The gate is the SUITE. A consumer-test compose is how a repo WITH a runtime
          # service supplies its bounded local-up — but not every repo has a service to
          # stand up. The L0 governance hub (FuzeSDLC, tier: governance) ships policy,
          # reusable workflows and the Python bootstrap/governance engine; it exposes no
          # HTTP service and depends on no external service, so there is nothing to
          # `docker compose up` and nothing in the mock matrix to mock. Its bounded
          # integration IS its suite: the engine run end-to-end against a scratch fixture
          # repo, fully offline (the suite asserts its own no-egress boundary). Requiring a
          # consumer-test compose there would force a hollow, serviceless stack — the
          # cargo-cult the ADLC is meant to avoid. So: a suite with no compose is a valid
          # bounded local-up (offline, no stack); a suite WITH a compose stands the stack up
          # first, as before. Only the ABSENCE OF A SUITE is a no-op that re-files the issue.
          if [ -z "$SUITE" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"; echo "SUITE_PRESENT=false" >> "$GITHUB_ENV"
            echo "::notice title=nightly-integration::No integration suite detected — no-op green; filing/keeping the @fuze build issue."
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
            {
              echo "SUITE_PRESENT=true"
              echo "SUITE=$SUITE"
            } >> "$GITHUB_ENV"
            if [ -n "$CT" ]; then
              { echo "HAS_LOCALUP=true"; echo "CT=$CT"; } >> "$GITHUB_ENV"
              echo "::notice title=nightly-integration::Detected suite=$SUITE, local-up=$CT"
            else
              echo "HAS_LOCALUP=false" >> "$GITHUB_ENV"
              echo "::notice title=nightly-integration::Detected suite=$SUITE with no consumer-test compose — no service to stand up; the suite runs in its own bounded offline environment (governance/service-less repo)."
            fi
          fi

      - name: Stand up bounded local-up (consumer-test + mocks)
        if: env.HAS_LOCALUP == 'true'
        shell: bash
        run: |
          dir=$(dirname "$CT"); envf=()
          [ -f "$dir/versions.env" ] && envf=(--env-file "$dir/versions.env")
          echo "::group::consumer-test up"
          docker compose "${envf[@]}" -f "$CT" up -d --wait || { echo "bounded stack failed to come up"; docker compose -f "$CT" logs | tail -120; exit 1; }
          echo "::endgroup::"

      # Explicit setup-python, and it is load-bearing on a self-hosted runner.
      # Nothing preinstalls Python on an ARC runner image the way a GitHub-hosted
      # image does, so the bare `pip install -q pytest` in the `pytest` case below
      # dies with `pip: command not found` — and because that step runs under
      # `set -e`, it takes the whole job down before any fallback line executes.
      # Every consuming repo that hit this (FuzeService, FuzeSocial, FuzeSales,
      # FuzeInfra) had already added this step locally, which is drift the canonical
      # caused: a re-render from this template would have silently deleted their fix
      # and reintroduced the failure. Hosted runners are unaffected — setup-python
      # is a no-op there when the version is already cached.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: '3.12' }
      - name: Run integration/contract suite (mocks only — no real external egress)
        if: env.SUITE_PRESENT == 'true'
        shell: bash
        env:
          TWILIO_MOCK: "true"
          NODE_ENV: test
        run: |
          set -e
          case "$SUITE" in
            npm)
              (npm ci || npm install) >/dev/null 2>&1
              if npm run | grep -q 'test:integration'; then npm run test:integration; else npm run test:e2e; fi ;;
            pytest)
              for req in $(git ls-files '**/requirements*.txt' 'requirements*.txt' | head -3); do pip install -q -r "$req" 2>/dev/null || true; done
              pip install -q pytest
              pytest -m integration -q ;;
            manifest)
              cmd=$(jq -r '.integrationTest' .fuze/manifest.json); echo "running: $cmd"; bash -lc "$cmd" ;;
          esac

      - name: Tear down
        if: always() && env.HAS_LOCALUP == 'true'
        shell: bash
        run: docker compose -f "$CT" down -v || true

      - name: No suite yet — file ONE idempotent @fuze build issue
        if: env.SUITE_PRESENT == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          title="Build nightly integration suite + bounded local-up"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then echo "tracking issue #$existing already open — not re-mentioning @fuze"; exit 0; fi
          gh label create integration --color 1d76db --description "nightly integration tests" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" --label integration --title "$title" --body "$(cat <<'EOF'
          @fuze — this repo has no nightly integration suite / bounded local-up yet, so **Nightly Integration** is a no-op here. Please build it (contract-first), per the FuzeSDLC standard, landing a **DRAFT PR** (do not merge):

          - **devops-engineer** — vendor FuzeInfra as a submodule; wire `docker-compose.consumer-test.yml` + `versions.env` + the external-service mock matrix (MailHog / Twilio-mock / Permit-offline / Stripe-test / Prism-MSW / LocalStack); enforce no prod egress.
          - **test-engineer** — author the integration/contract suite against that bounded stack; expose it as `test:integration` (npm) or `pytest -m integration`, or declare `integrationTest` in `.fuze/manifest.json`.
          - **local-env-verifier** — verify the boundary (stack stands up, mocks are hit, no real external host contacted).

          Follow `governance/local-environment.md` + the `api-contract-first` skill. Do NOT use plan mode / AskUserQuestion; if blocked, push what you have and comment `BLOCKED: <question>`.

          STATE:
          - done: nothing yet
          - remaining: bounded local-up wiring · integration/contract suite · boundary verification
          - next action: devops-engineer stands up the consumer-test compose
          EOF
          )"

  autofix:
    needs: integration
    # Only when a real suite ran AND failed; loop-guarded so a fix branch never re-triggers itself.
    if: >-
      ${{ always() && needs.integration.result == 'failure' &&
          needs.integration.outputs.ran == 'true' &&
          !startsWith(github.ref_name, 'nightly-autofix-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve LLM endpoint (LiteLLM in-cluster, vendor fallback)
        id: llm
        uses: ./.github/actions/llm-endpoint
        with:
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          fallback-chain: ${{ vars.FUZE_LLM_FALLBACK_CHAIN || 'anthropic,openai,gemini' }}
          fallback-anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fallback-openai-key: ${{ secrets.OPENAI_API_KEY }}
          fallback-gemini-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Auto-fix → DRAFT PR (never auto-merge)
        uses: ./.github/actions/fuze-code-action
        with:
          anthropic-api-key: ${{ steps.llm.outputs.auth-token }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # allowed_bots: `fuzeone-bot`, the identity GitHub reports as the actor for
          # this repo's SCHEDULED runs. Without it claude-code-action's human-actor check
          # aborts the rung ~1s in, BEFORE any model call, with:
          #   "Workflow initiated by non-human actor: fuzeone-bot (actor not found on
          #    GitHub). Add bot to allowed_bots list or use '*' to allow all bots."
          # Measured, not inferred: izzywdev/FuzeSales run 33508720260 (2026-09-01) shows
          # `ALLOWED_BOTS: ` / `"allowed_bots": ""` immediately above that error, and
          # izzywdev/FuzeInfra run 33505900409 fails identically in nightly-integration's
          # autofix job. The failure is indistinguishable in a skimmed log from a provider
          # outage, which is why this was mis-attributed to "credit balance too low" —
          # that string comes from a DIFFERENT, upstream failure mode.
          #
          # `fuzeone-bot` has no backing GitHub user (GET /users/fuzeone-bot -> 404), so it
          # lands in claude-code-action's `catch` branch in src/github/validation/actor.ts,
          # which still consults isAllowedBot() before throwing — a literal login here is
          # sufficient and no `*` is needed.
          #
          # Deliberately NOT `*`. This repo runs dependabot; under `*` any bot-authored
          # event could start an agent run holding the resolved LLM credential and repo
          # write. A cron cannot be triggered by dependabot, so naming the one scheduler
          # identity keeps the gate doing its job.
          allowed-bots: "fuzeone-bot,fuze-agent"
          task-prompt: |
            The **nightly integration suite** for ${{ github.repository }} FAILED
            (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Diagnose from the failed run logs and the integration suite.

            Open exactly ONE loop-guarded fix on a branch named `nightly-autofix-<short-slug>` and a
            **DRAFT** pull request. NEVER merge it; NEVER push to the default branch. Route by root cause:
              - product/business-logic bug  -> backend-engineer
              - env / CI / bounded local-up -> devops-engineer
              - flaky or contract mismatch  -> test-engineer
            Keep the bounded local-up boundary (mocks only, no real external egress).

            File or UPDATE one idempotent tracking issue (label `integration`) linking the failed run and
            the draft PR with a STATE block. If you cannot reproduce, or the fix needs a human decision,
            post the diagnosis on the issue and stop. Do NOT use plan mode / AskUserQuestion.
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
        # No merge step — draft PR + tracking issue only, per the ADLC (never auto-merge).
