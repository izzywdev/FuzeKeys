# fuze:managed template=helm-validate.yml baseline=v1 digest=sha256:05153514c3fcd9bcd633731888dbac7e3c3aa32d66999f9a408bf6b66df2b6e5
name: Helm Chart Validation

on:
  # Manual trigger. Deliberate, not decoration: when GitHub stops delivering
  # pull_request events — measured today across FuzeCall, FuzeMarket, FuzeExecutive
  # and FuzeInfra, the last of which saw no pull_request event for ANY branch
  # repo-wide for ~25 minutes — a PR sits with zero checks and no way to force them
  # onto its head. Actions itself stays healthy throughout, so a workflow_dispatch
  # run completes in under a minute and unblocks the PR. Without it the only
  # remedies are pushing commits that may also not be delivered, or waiting.
  workflow_dispatch:
  push:
    branches: [master, develop, staging]
    paths:
      # Both layouts — see the discovery step below for why the split exists and
      # why it is not normalized. Watching only helm/** meant a chart change in a
      # deploy/helm/ repo never even triggered this workflow.
      - 'helm/**'
      - 'deploy/helm/**'
      - '.github/workflows/helm-validate.yml'
  # Merge queue: this job emits the required context "Lint & schema-validate chart",
  # so without merge_group a queued group can never satisfy branch protection.
  # It reads no pull_request context (verified: 0 references), so no fallbacks
  # are needed here.
  merge_group:
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Lint & schema-validate chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      # Auto-discovers every chart so this template works verbatim in any repo
      # (do NOT hardcode a chart name — an earlier template hardcoded
      # helm/fuzeinfra and failed in every consuming repo with "no such file").
      #
      # BOTH LAYOUTS ARE DISCOVERED, and that is the whole point of this step.
      # The family is genuinely split — 10 clones keep charts under deploy/helm/
      # (FuzeCall, FuzeDeploy, FuzeHub, FuzePicker, FuzePlan, FuzeSocial,
      # FuzeMarket, FuzeKeys, FuzeX, FuzeAgent) and the rest under helm/. This
      # step used to glob helm/*/Chart.yaml only and `exit 0` when it found
      # nothing, so every one of those repos got a GREEN "Helm Chart Validation"
      # that had validated no chart at all — the failure mode is indistinguishable
      # from success, which is why it survived so long.
      #
      # The layouts are NOT normalized deliberately: an Argo Application pins
      # `spec.source.path` (e.g. fuzeservice/deploy/argocd/application.yaml ->
      # `path: helm/fuzeservice`), so moving a chart silently breaks prod sync.
      # Fix discovery, never the layout.
      - name: Lint & validate all charts (helm/ and deploy/helm/)
        run: |
          # `pipefail` is the fix for issue #385. This block used to inherit Actions'
          # default `bash -e {0}` — `-e` on, `pipefail` OFF — and validated via
          # `helm template ... | kubeconform ...`. Without pipefail a pipeline's exit
          # status is the LAST command's, so a failed `helm template` (render error)
          # produced empty stdin, kubeconform reported "0 resource found" and exited 0,
          # and this gate went GREEN while validating nothing. `helm template` is now
          # rendered to a FILE first (below), which removes the pipe entirely — a more
          # durable fix than remembering pipefail on every future edit — and pipefail
          # is set as belt-and-suspenders for the remaining commands.
          set -euo pipefail
          shopt -s nullglob
          charts=(helm/*/Chart.yaml deploy/helm/*/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            # A repo that declares a chart capability but ships no chart is a
            # defect, not a no-op. Only a repo with NEITHER directory is exempt.
            if [ -d helm ] || [ -d deploy/helm ]; then
              echo "::error title=helm-validate::a chart directory exists but contains no */Chart.yaml — this repo declares a chart it does not ship"
              ls -la helm deploy/helm 2>/dev/null || true
              exit 1
            fi
            echo "No helm/ or deploy/helm/ directory — this repo ships no chart; nothing to validate."
            exit 0
          fi
          echo "Discovered ${#charts[@]} chart(s): ${charts[*]}"

          # Render to a file, THEN validate the file — never `helm template | kubeconform`.
          # A non-zero `helm template` now fails the step directly (via set -e), instead
          # of being swallowed by the pipe. $@ carries the optional `-f <overlay>` flag.
          render_and_validate() {
            local name="$1" chart="$2"; shift 2
            local out; out="$(mktemp)"
            helm template "$name" "$chart" "$@" > "$out"
            # A chart may legitimately render zero resources: the canonical starter chart
            # (community-templates/chart) is `enabled: false`-gated and renders NOTHING
            # until the real service ships. That is not a failure — a render FAILURE was
            # already caught above by the non-zero exit. Warn (visible on the run) rather
            # than failing, so a freshly-onboarded repo's disabled starter chart does not
            # go red. (Issue #385 pt.4: zero-resource-is-hard-fail would break these.)
            if [ ! -s "$out" ]; then
              echo "::warning title=helm-validate::$chart $* rendered zero resources (e.g. an enabled:false starter chart) — nothing for kubeconform to validate"
              rm -f "$out"; return 0
            fi
            kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas < "$out"
            rm -f "$out"
          }

          for chartyaml in "${charts[@]}"; do
            chart="$(dirname "$chartyaml")"
            name="$(basename "$chart")"
            # helm lint severity contract (issue #385 pt.3): `helm lint` exits non-zero
            # only on [ERROR] severity — [INFO]/[WARNING] (incl. an `[INFO] Fail` from a
            # chart's own fail-closed guard) exit 0 and do NOT fail this step by design.
            # `--strict` (promote warnings to errors) is deliberately NOT enabled: it
            # would red charts fleet-wide on pre-existing warnings. The render+pipefail
            # change below — not lint — is what closes the vacuous-pass hole.
            echo "::group::helm lint $chart"
            helm lint "$chart"
            echo "::endgroup::"
            echo "::group::template + kubeconform $chart (base values)"
            render_and_validate "$name" "$chart"
            echo "::endgroup::"
            for overlay in "$chart"/values-*.yaml; do
              [ -e "$overlay" ] || continue
              echo "::group::overlay $(basename "$overlay")"
              helm lint "$chart" -f "$overlay"
              render_and_validate "$name" "$chart" -f "$overlay"
              echo "::endgroup::"
            done
          done
