name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fuzekeys_test
          POSTGRES_USER: fuzekeys_user
          POSTGRES_PASSWORD: fuzekeys_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          backend/.venv
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-

    - name: Install Python dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # black/isort/mypy/pytest/pytest-asyncio are pinned in requirements.txt.
        # Re-listing them unpinned here was a no-op that would silently float the
        # formatter the moment a pin moved -- and a floating black rewrites the
        # whole tree. Only install what requirements.txt does not pin.
        pip install pytest-cov flake8

    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Python Code Formatting Check (Black)
      run: |
        cd backend
        black --check --diff .

    - name: Python Import Sorting Check (isort)
      run: |
        cd backend
        isort --check-only --diff .

    - name: Python Linting (Flake8)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Python Type Checking (MyPy)
      run: |
        cd backend
        mypy app --ignore-missing-imports

    - name: Frontend Linting (ESLint)
      run: |
        cd frontend
        npm run lint

    - name: Frontend Type Checking
      run: |
        cd frontend
        npm run type-check

    - name: Frontend Build
      run: |
        cd frontend
        npm run build

    - name: Set up test environment
      env:
        DATABASE_URL: postgresql://fuzekeys_user:fuzekeys_password@localhost:5432/fuzekeys_test
        DATABASE_URL_ASYNC: postgresql+asyncpg://fuzekeys_user:fuzekeys_password@localhost:5432/fuzekeys_test
        REDIS_URL: redis://localhost:6379
        SECRET_KEY: test-secret-key-for-ci
        MASTER_KEY_SALT: test-salt-for-ci
      run: |
        cd backend
        # Run database migrations
        python -c "import asyncio; from app.database import init_database; asyncio.run(init_database())"

    - name: Run Python Tests
      env:
        DATABASE_URL: postgresql://fuzekeys_user:fuzekeys_password@localhost:5432/fuzekeys_test
        DATABASE_URL_ASYNC: postgresql+asyncpg://fuzekeys_user:fuzekeys_password@localhost:5432/fuzekeys_test
        REDIS_URL: redis://localhost:6379
        SECRET_KEY: test-secret-key-for-ci
        MASTER_KEY_SALT: test-salt-for-ci
        PYTHONPATH: .
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

    - name: Run Frontend Tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false

    - name: Upload Python Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Upload Frontend Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install security scanning tools
      run: |
        # bandit[toml] so bandit can read its config from backend/pyproject.toml.
        # pip-audit replaces `safety`: safety 3.x requires an authenticated
        # account and exits with InvalidCredentialError on every unauthenticated
        # run, so that step could never have passed here.
        pip install "bandit[toml]" pip-audit

    - name: Install frontend dependencies (for npm audit)
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Run Python Security Scan (Bandit)
      run: |
        cd backend
        bandit -c pyproject.toml -r app/ -f json -o bandit-report.json || true
        bandit -c pyproject.toml -r app/

    - name: Run Dependency Vulnerability Audit
      # Fails on any advisory that is not in security/dependency-audit-baseline.json,
      # so a PR that pulls in a newly vulnerable dependency is blocked while the
      # pre-existing debt stays enumerated and reviewable rather than blocking
      # every merge. See the script's docstring.
      run: python scripts/dependency_audit.py

  permit-io-scraper-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # This job used to `cd scrapers/permit_io` and import a `scraper` module with
    # UserCredentials/PermitIOScraper. That path has never existed in this
    # repository's history and neither has that module -- the permit.io
    # integration lives at backend/app/integrations/site/permit_io and exposes
    # PermitIOIntegration. The job therefore failed at the first `cd` every time
    # it was reached. Repointed at the real package.
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Permit.io Integration (Dry Run)
      # No browser is launched, so the Playwright browser download is not needed
      # here; the automation modules only need the Python package to import.
      run: |
        cd backend
        python - <<'PY'
        from app.integrations.site import get_available_sites, get_site_capabilities
        from app.integrations.site.permit_io import (
            CAPABILITIES,
            PermitIOIntegration,
            __site__,
        )

        print("Discovering site integrations...")
        sites = get_available_sites()
        assert "permit_io" in sites, f"permit_io not discovered, got {sites}"

        # The package publishes itself as "permit.io" while the module is
        # permit_io; the lookup must resolve the published identifier.
        caps = get_site_capabilities(__site__)
        for op in ("signup", "signin", "apikey"):
            assert caps[op] is True, f"{op} capability missing: {caps}"
            assert CAPABILITIES[op] is True, f"{op} not declared: {CAPABILITIES}"

        integration = PermitIOIntegration(headless=True)
        assert integration.config.BASE_URL.startswith("https://"), (
            f"insecure base URL: {integration.config.BASE_URL}"
        )
        for entry in ("signup_account", "signin_account", "create_api_key"):
            assert callable(getattr(integration, entry)), f"missing {entry}"

        print(f"Dry run OK: {__site__} exposes {sorted(caps)}")
        PY

  build-status:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, permit-io-scraper-test]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [[ "${{ needs.lint-and-test.result }}" == "success" && 
              "${{ needs.security-scan.result }}" == "success" && 
              "${{ needs.permit-io-scraper-test.result }}" == "success" ]]; then
          echo "✅ All checks passed!"
          exit 0
        else
          echo "❌ Some checks failed!"
          exit 1
        fi 