# FROZEN CONTRACT STUB - FKY-12 design spike (vault sharing, v1)
#
# Status:      FROZEN for FKY-3 fan-out. Hand-authored design artifact; it is NOT
#              generated from the FastAPI app and is NOT merged into
#              contracts/openapi.yaml (that file is generated - see its header).
#              When FKY-3 implements these routes, the generated contracts/openapi.yaml
#              must be diffed against this file; any divergence is a contract bug
#              fixed by amending THIS file via a contract PR (bump info.version,
#              breaking => MAJOR), never by silently diverging in an implementation.
# Design:      docs/design/vault-sharing.md
# Decision:    docs/decisions/FKY-12-vault-sharing-decision-record.md
#
# NON-LEAKAGE RULES (normative, enforced by a contract test in FKY-3 that walks every
# response schema in this file):
#   R1. No response, error, log line or audit row ever carries a secret VALUE, a
#       derived credential, a macaroon/grant handle, or a custody handle
#       (vault_item_ref, openbao_path, vault_ref, collection id). Sharing, moving and
#       copying are metadata operations; values move only inside the backend between
#       the custody adapter and the vault, never across this API.
#   R2. Banned property names - exact, case-insensitive match on a property key at any
#       depth of any response schema (see x-forbidden-response-property-names):
#       value, secret, password, passcode, pin, cvv, cvc, pan, number, token,
#       credential, api_key, private_key, totp, seed, handle, ref, path.
#   R3. Absent and invisible are indistinguishable: an object the caller cannot
#       `read` returns 404, never 403. 403 is returned only when the caller can
#       already see the object but lacks the action.
#   R4. Error `detail` strings are fixed per code; they never echo caller-supplied
#       names, emails, ids of other principals, or custody information.
#   R5. Every caller identity comes from the verified token. No request body or
#       query field names the actor ("granted_by", "owner_id", "user_id" are absent
#       on purpose).
openapi: 3.1.0
info:
  title: FuzeKeys Vault Sharing API
  version: 1.0.0
  summary: Vault entities, share/revoke, and move/copy of secrets between vaults.
  description: |
    Governs WHO may read or operate a vault asset (durable ACL). It never returns a
    secret value. Obtaining a short-lived credential for a shared asset is a separate
    access path that is authorized by this ACL and issued by the broker core
    (`backend/app/broker`); it is out of scope for this file.

    Roles map onto the Permit `VaultAsset` resource (viewer / operator / admin) - see
    docs/design/vault-sharing.md section 6.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
x-contract-status: frozen
x-contract-ticket: FKY-12
x-forbidden-response-property-names:
  - value
  - secret
  - password
  - passcode
  - pin
  - cvv
  - cvc
  - pan
  - number
  - token
  - credential
  - api_key
  - private_key
  - totp
  - seed
  - handle
  - ref
  - path
servers:
  - url: /
    description: Same origin as the FuzeKeys backend.
tags:
  - name: Vaults
    description: First-class vault entities (personal, org, org_user).
  - name: Vault Shares
    description: Durable sharing of a vault or a single asset with a user, persona, org or org group.
  - name: Vault Transfers
    description: Move (re-home) and copy (duplicate custody) of assets between vaults.
security:
  - UserSession: []
  - DelegatedUser: []
paths:
  /api/v1/vaults:
    post:
      tags: [Vaults]
      operationId: createVault
      summary: Create an org or org_user vault
      description: |
        Personal vaults are implicit (one per user, created by the migration/backfill and
        on first use) and cannot be created here (422 `validation_error`).
        Caller must be an owner/admin of the org (`organization_members.role`). For
        `org_user`, `group_id` must be an org group of that org.
        Human session only (agents get 403 `human_session_required`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultCreate'
      responses:
        '201':
          description: Vault created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Vaults]
      operationId: listVaults
      summary: List vaults the caller can see
      description: |
        Returns vaults the caller owns, is a member of (org owner/admin, org_user group
        member) or holds an active share on. Metadata only. Offset pagination, stable
        order (created_at desc, vault_id desc).
      security:
        - UserSession: []
        - DelegatedUser: []
        - AgentToken: []
      parameters:
        - name: type
          in: query
          required: false
          schema: {$ref: '#/components/schemas/VaultType'}
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of vaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vaults/{vault_id}:
    get:
      tags: [Vaults]
      operationId: getVault
      summary: Get one vault (metadata)
      description: 404 when absent OR not visible to the caller (R3).
      security:
        - UserSession: []
        - DelegatedUser: []
        - AgentToken: []
      parameters:
        - $ref: '#/components/parameters/VaultId'
      responses:
        '200':
          description: The vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-shares:
    post:
      tags: [Vault Shares]
      operationId: createShare
      summary: Share a vault or one asset
      description: |
        Creates a durable ACL entry for `grantee` on `resource` with `role`.

        Caller must hold the Permit `VaultAsset:share` action on the resource (vault
        owner; org owner/admin for org vaults; owner group admins for org_user vaults).
        A share role of `admin` does NOT include `share` (no re-sharing in v1).

        Grantee/role rules (422 on violation):
        - personal resources: grantee type `user` or `persona` only.
        - org resources: `user`, `persona`, `org_group` (same org), `org` (same org).
        - org_user resources: `user`, `persona`, `org_group` (same org). Not `org`.
        - `persona` and `org` grantees are capped at role `operator`.
        - `reveal` (admin) is never reachable through a persona or org grantee.

        Group/org grantees are stored as ONE row and expanded to members at access
        time (dynamic expansion, not a snapshot).

        Replays: same Idempotency-Key + same body returns the original response. A
        different key but identical (resource, grantee, role) active share returns 200
        with the existing share. Same (resource, grantee) with a DIFFERENT role is 409
        `share_exists` (use PATCH).

        `state` is `pending_activation` until the Permit instance grant is reconciled,
        then `active`. A pending share grants nothing (fail closed).
        Human session only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreate'
      responses:
        '200':
          description: Identical active share already existed (idempotent replay); no change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '201':
          description: Share created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-shares/received:
    get:
      tags: [Vault Shares]
      operationId: listReceivedShares
      summary: Shared with me
      description: |
        Shares that currently give the caller access, including access through org /
        org-group / persona expansion (`via`). One item per share path; `effective_role`
        is the maximum role the caller holds on that resource across ALL paths.
        Revoked, expired and pending_activation shares are not returned.
        Metadata only. Agent tokens see only shares that reach the persona(s) they are
        scoped to. Stable order: created_at desc, share_id desc.

        Route-order note: declare this path before `/{share_id}` in the router.
      security:
        - UserSession: []
        - DelegatedUser: []
        - AgentToken: []
      parameters:
        - name: resource_kind
          in: query
          required: false
          schema: {type: string, enum: [vault, asset]}
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of received shares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedSharePage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-shares/granted:
    get:
      tags: [Vault Shares]
      operationId: listGrantedShares
      summary: Shares on resources I can manage
      description: |
        Shares on resources where the caller holds `VaultAsset:share` (all of them, any
        creator). Filter to one resource with `vault_id` or `asset_kind`+`asset_id`
        (an unmanageable/unknown resource yields an EMPTY page, not 404, to avoid an
        existence oracle on list filters). Metadata only.
      parameters:
        - name: vault_id
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: asset_kind
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AssetKind'}
        - name: asset_id
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: state
          in: query
          required: false
          schema: {$ref: '#/components/schemas/ShareState'}
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of shares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-shares/{share_id}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    patch:
      tags: [Vault Shares]
      operationId: updateShare
      summary: Change a share's role or expiry
      description: |
        Requires `VaultAsset:share` on the shared resource. 404 if the share is absent
        or the caller cannot manage it (R3). 409 `share_not_active` for a revoked or
        expired share. Role changes obey the same grantee caps as creation.
        A downgrade takes effect immediately (local ACL is evaluated first); an
        upgrade takes effect after Permit reconciliation (state may return to
        `pending_activation` for the upgraded role only; the old role stays in force
        until then).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePatch'
      responses:
        '200':
          description: Updated share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [Vault Shares]
      operationId: revokeShare
      summary: Revoke a share
      description: |
        Idempotent. Revocation is effective immediately: the local ACL row is marked
        `revoked` in the same transaction that revokes every outstanding broker lease
        issued under this share; Permit de-provisioning follows asynchronously and is
        safe because the local check runs first.

        Allowed for (a) callers with `VaultAsset:share` on the resource and (b) the
        grantee of a DIRECT user share ("leave"). A member cannot individually leave a
        group/org share: 403 `group_share_cannot_be_left`.

        Revoking an already-revoked share returns 200 with the same body. Revocation
        cannot recall a value the grantee already copied; see the design doc.
        Absent or unmanageable => 404 (R3).
      responses:
        '200':
          description: Share is revoked (now or previously).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-assets/move:
    post:
      tags: [Vault Transfers]
      operationId: moveAssets
      summary: Move assets to another vault (re-home + revoke source access)
      description: |
        Re-homes each asset (the asset row id is preserved; the custody reference may
        change) into `target_vault_id`, and in the same unit of work revokes
        asset-scoped shares and outstanding broker leases bound to the source location.
        Vault-level shares of the source vault stop applying automatically.

        Authorization per item: `VaultAsset:delete` on the source asset AND
        `VaultAsset:create` on the target vault.

        Request-level failures (target vault absent/invisible, caller lacks `create`
        on it, bad body, missing Idempotency-Key) fail the WHOLE request with a 4xx
        before any item is touched. Item-level failures never abort other items.

        Aggregate status: 200 iff every item `completed`; 202 iff every item is
        `approval_required` (high-sensitivity cross-boundary moves need human
        approval); otherwise 207. Retrying with the SAME Idempotency-Key resumes items
        in `needs_recovery`/`approval_required` and is a no-op for `completed` ones.
        Human session only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Every item moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '202':
          description: Every item is waiting for human approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '207':
          description: Mixed per-item outcomes (inspect `results[].status`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/vault-assets/copy:
    post:
      tags: [Vault Transfers]
      operationId: copyAssets
      summary: Copy assets to another vault (duplicate custody)
      description: |
        Creates an INDEPENDENT duplicate of each asset in `target_vault_id`: a new
        asset row id, a new custody reference, `copied_from` lineage (provenance only;
        nothing is synchronized afterwards). The source and its shares are untouched;
        the copy inherits NO shares (the target vault's own access applies).

        Authorization per item: `VaultAsset:reveal` on the source asset (a copy is a
        read of the value by the server on the caller's behalf, so it needs the
        strongest read right) AND `VaultAsset:create` on the target vault.

        Status aggregation, atomicity, idempotency and approval semantics are
        identical to `moveAssets`. The value never appears in the response.
        Human session only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Every item copied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '202':
          description: Every item is waiting for human approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '207':
          description: Mixed per-item outcomes (inspect `results[].status`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    UserSession:
      type: http
      scheme: bearer
      description: Human user session JWT (same scheme as the existing HTTPBearer). The actor is the verified user; a verified PlatformIdentity binding is required (403 `platform_identity_required` otherwise).
    DelegatedUser:
      type: apiKey
      in: header
      name: X-Fuze-Delegation
      description: FuzeFront delegated end-user token, presented together with the service `Authorization` bearer (see app.security.fuzefront_auth.delegated_auth). Subject and tenant must match the local PlatformIdentity binding.
    AgentToken:
      type: http
      scheme: bearer
      description: MCP agent token (agents.token_hash). Accepted ONLY on read-only metadata operations; mutating operations reject it with 403 `human_session_required`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (UUID recommended). Required on every mutating POST. Same key + same body replays the first result; same key + different body is 409 `idempotency_conflict`. Retained 24h.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    VaultId:
      name: vault_id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ShareId:
      name: share_id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
  responses:
    BadRequest:
      description: |
        400. Malformed request framing: missing or malformed `Idempotency-Key`
        (`idempotency_key_required`). Body validation errors are 422, not 400.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Idempotency-Key header is required, code: idempotency_key_required}
    Unauthorized:
      description: 401. Missing, invalid or expired credentials (`unauthenticated`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Authentication required, code: unauthenticated}
    Forbidden:
      description: |
        403. The caller is authenticated and (where an object is involved) can already
        see it, but may not do this. Codes: `human_session_required` (agent token on a
        mutating route), `platform_identity_required` (no verified PlatformIdentity
        binding), `insufficient_role`, `group_share_cannot_be_left`. Never used for
        objects the caller cannot see (those are 404).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Insufficient role for this action, code: insufficient_role}
    NotFound:
      description: |
        404. The referenced object is absent OR not visible to the caller (identical
        response). Codes name the request field that failed to resolve:
        `resource_not_found`, `vault_not_found`, `share_not_found`,
        `grantee_not_found` (also for a user in another tenant or without a verified
        binding), `target_vault_not_found`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Not found, code: target_vault_not_found}
    Conflict:
      description: |
        409. Valid request that conflicts with current state. Codes: `self_share`,
        `share_exists`, `share_not_active`, `same_vault`, `asset_in_transition`,
        `vault_name_conflict`, `idempotency_conflict`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Target is the resource owner, code: self_share}
    Unprocessable:
      description: |
        422. Request is semantically invalid regardless of state. Codes:
        `validation_error`, `role_not_allowed_for_grantee`,
        `grantee_type_not_allowed_for_resource`, `invalid_expiry`,
        `share_limit_reached`, `tenant_boundary_violation`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Role not allowed for this grantee type, code: role_not_allowed_for_grantee}
    TooManyRequests:
      description: 429. Per-actor rate limit on share/transfer mutations (`rate_limited`). Carries Retry-After.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Too many requests, code: rate_limited}
    Unavailable:
      description: |
        503. Fail-closed dependency outage: Permit/Security decision service
        (`authorization_unavailable`) or the custody backend (`custody_unavailable`).
        Never an allow. Safe to retry with the same Idempotency-Key.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {detail: Authorization unavailable, code: authorization_unavailable}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [detail, code]
      properties:
        detail:
          type: string
          description: Fixed per code (R4). Never echoes caller-supplied names or foreign ids.
        code:
          type: string
          enum:
            - unauthenticated
            - human_session_required
            - platform_identity_required
            - insufficient_role
            - resource_not_found
            - vault_not_found
            - share_not_found
            - grantee_not_found
            - target_vault_not_found
            - self_share
            - share_exists
            - share_not_active
            - same_vault
            - asset_in_transition
            - vault_name_conflict
            - idempotency_key_required
            - idempotency_conflict
            - role_not_allowed_for_grantee
            - grantee_type_not_allowed_for_resource
            - invalid_expiry
            - share_limit_reached
            - tenant_boundary_violation
            - group_share_cannot_be_left
            - validation_error
            - rate_limited
            - authorization_unavailable
            - custody_unavailable
            - internal_error
        request_id:
          type: string
          description: Correlation id for support/audit lookup.
    VaultType:
      type: string
      enum: [personal, org, org_user]
    ShareRole:
      type: string
      description: Maps 1:1 onto the Permit VaultAsset instance roles of the same name.
      enum: [viewer, operator, admin]
    VaultAction:
      type: string
      description: Permit VaultAsset actions an effective role allows.
      enum: [read, use, reveal, create, update, delete, share]
    AssetKind:
      type: string
      description: login = accounts row, card = identity_cards row, api_credential = api_credentials row.
      enum: [login, card, api_credential]
    Sensitivity:
      type: string
      enum: [low, medium, high]
    ShareState:
      type: string
      enum: [pending_activation, active, revoked, expired]
    GranteeType:
      type: string
      enum: [user, persona, org, org_group]
    PageInfo:
      type: object
      additionalProperties: false
      required: [offset, limit, total, next_offset]
      properties:
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        next_offset: {type: [integer, 'null'], minimum: 0}
    VaultOwner:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {type: string, enum: [user, org, org_group]}
        id: {type: integer, minimum: 1}
    Vault:
      type: object
      additionalProperties: false
      required: [vault_id, type, name, org_id, owner, my_role, access, created_at]
      properties:
        vault_id: {type: integer, minimum: 1}
        type: {$ref: '#/components/schemas/VaultType'}
        name: {type: string, minLength: 1, maxLength: 200}
        org_id:
          type: [integer, 'null']
          description: Null for personal vaults. Same tenant as Identity.org_id semantics.
        owner: {$ref: '#/components/schemas/VaultOwner'}
        my_role:
          type: string
          description: The caller's effective role on this vault (owner is the highest).
          enum: [owner, admin, operator, viewer]
        access:
          type: string
          description: How the caller reaches this vault.
          enum: [owned, member, shared]
        created_at: {type: string, format: date-time}
    VaultCreate:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type: {type: string, enum: [org, org_user]}
        name: {type: string, minLength: 1, maxLength: 200}
        org_id:
          type: integer
          minimum: 1
          description: Required for both types.
        group_id:
          type: integer
          minimum: 1
          description: Required for org_user (owning org group); forbidden for org.
      allOf:
        - if:
            properties: {type: {const: org_user}}
          then:
            required: [org_id, group_id]
          else:
            required: [org_id]
    VaultPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Vault'}
        page: {$ref: '#/components/schemas/PageInfo'}
    ItemRef:
      type: object
      additionalProperties: false
      required: [asset_kind, asset_id]
      properties:
        asset_kind: {$ref: '#/components/schemas/AssetKind'}
        asset_id: {type: integer, minimum: 1}
    VaultRef:
      type: object
      additionalProperties: false
      required: [kind, vault_id]
      properties:
        kind: {type: string, const: vault}
        vault_id: {type: integer, minimum: 1}
    AssetRef:
      type: object
      additionalProperties: false
      required: [kind, asset_kind, asset_id]
      properties:
        kind: {type: string, const: asset}
        asset_kind: {$ref: '#/components/schemas/AssetKind'}
        asset_id: {type: integer, minimum: 1}
    ResourceRef:
      description: Request-side pointer to what is shared.
      oneOf:
        - $ref: '#/components/schemas/VaultRef'
        - $ref: '#/components/schemas/AssetRef'
      discriminator:
        propertyName: kind
        mapping:
          vault: '#/components/schemas/VaultRef'
          asset: '#/components/schemas/AssetRef'
    GranteeRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/GranteeType'}
        id:
          type: integer
          minimum: 1
          description: users.id | identities.id | organizations.id | org_groups.id depending on `type`.
    GranteeSummary:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/GranteeType'}
        id: {type: integer, minimum: 1}
        display_name:
          type: string
          description: Present only for principals in the caller's own tenant directory.
    AssetSummary:
      type: object
      additionalProperties: false
      required: [kind, asset_kind, asset_id, vault_id, label, sensitivity]
      properties:
        kind: {type: string, const: asset}
        asset_kind: {$ref: '#/components/schemas/AssetKind'}
        asset_id: {type: integer, minimum: 1}
        vault_id: {type: integer, minimum: 1}
        label:
          type: string
          description: |
            Non-secret display label only: login = website name; card = brand + last4
            (never PAN/CVV); api_credential = service + name. Never a value, never a
            custody handle.
        sensitivity: {$ref: '#/components/schemas/Sensitivity'}
        persona_id:
          type: [integer, 'null']
          description: Attached persona (identities.id) or null when detached.
    VaultSummary:
      type: object
      additionalProperties: false
      required: [kind, vault_id, vault_type, name]
      properties:
        kind: {type: string, const: vault}
        vault_id: {type: integer, minimum: 1}
        vault_type: {$ref: '#/components/schemas/VaultType'}
        name: {type: string}
    ResourceSummary:
      description: Response-side description of what is shared. Metadata only.
      oneOf:
        - $ref: '#/components/schemas/VaultSummary'
        - $ref: '#/components/schemas/AssetSummary'
      discriminator:
        propertyName: kind
        mapping:
          vault: '#/components/schemas/VaultSummary'
          asset: '#/components/schemas/AssetSummary'
    ShareCreate:
      type: object
      additionalProperties: false
      required: [resource, grantee, role]
      properties:
        resource: {$ref: '#/components/schemas/ResourceRef'}
        grantee: {$ref: '#/components/schemas/GranteeRef'}
        role: {$ref: '#/components/schemas/ShareRole'}
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Optional. Must be in the future and at most 365 days out (422 `invalid_expiry`). Null/absent = until revoked.
    SharePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: {$ref: '#/components/schemas/ShareRole'}
        expires_at:
          type: [string, 'null']
          format: date-time
    Share:
      type: object
      additionalProperties: false
      required: [share_id, resource, grantee, role, state, created_by_user_id, created_at, expires_at, revoked_at]
      properties:
        share_id: {type: integer, minimum: 1}
        resource: {$ref: '#/components/schemas/ResourceSummary'}
        grantee: {$ref: '#/components/schemas/GranteeSummary'}
        role: {$ref: '#/components/schemas/ShareRole'}
        state: {$ref: '#/components/schemas/ShareState'}
        created_by_user_id:
          type: integer
          minimum: 1
          description: Audit attribution only; does not confer revoke rights.
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        revoked_reason:
          type: [string, 'null']
          enum: [manual, moved, asset_deleted, vault_archived, grantee_left, expired, null]
    SharePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Share'}
        page: {$ref: '#/components/schemas/PageInfo'}
    ShareVia:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [direct, persona, org, org_group]}
        id:
          type: integer
          minimum: 1
          description: Persona / org / org-group id the access flowed through; absent for direct.
    ReceivedShare:
      type: object
      additionalProperties: false
      required: [share_id, resource, role, effective_role, effective_actions, via, granted_at, expires_at]
      properties:
        share_id: {type: integer, minimum: 1}
        resource: {$ref: '#/components/schemas/ResourceSummary'}
        role: {$ref: '#/components/schemas/ShareRole'}
        effective_role:
          $ref: '#/components/schemas/ShareRole'
        effective_actions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/VaultAction'}
          description: Actions allowed by `effective_role` (never includes `share`).
        via: {$ref: '#/components/schemas/ShareVia'}
        granted_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
    ReceivedSharePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReceivedShare'}
        page: {$ref: '#/components/schemas/PageInfo'}
    TransferRequest:
      type: object
      additionalProperties: false
      required: [target_vault_id, items]
      properties:
        target_vault_id: {type: integer, minimum: 1}
        target_persona_id:
          type: [integer, 'null']
          minimum: 1
          description: |
            Optional persona (identities.id) to attach in the target vault. When absent
            or null the asset keeps its persona only if the target vault is owned by
            the same user and in the same tenant; otherwise it is detached (persona_id
            null). A persona outside the caller's scope is a 404 `resource_not_found`.
        items:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {$ref: '#/components/schemas/ItemRef'}
    TransferItemStatus:
      type: string
      description: |
        completed - done and durable.
        failed - not performed; source untouched; see `error`.
        approval_required - high-sensitivity cross-boundary operation is waiting for a human (see approval_request_id); retry with the same Idempotency-Key after approval.
        needs_recovery - custody step finished but the metadata commit did not; the asset is frozen (409 asset_in_transition for writers) until a retry with the same Idempotency-Key or the recovery job completes it. No value is ever exposed in this state.
      enum: [completed, failed, approval_required, needs_recovery]
    TransferItemError:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code:
          type: string
          enum:
            - resource_not_found
            - insufficient_role
            - same_vault
            - asset_in_transition
            - tenant_boundary_violation
            - custody_unavailable
            - authorization_unavailable
            - internal_error
        detail: {type: string}
    TransferItemResult:
      type: object
      additionalProperties: false
      required: [asset_kind, asset_id, status]
      properties:
        asset_kind: {$ref: '#/components/schemas/AssetKind'}
        asset_id:
          type: integer
          minimum: 1
          description: The SOURCE asset id as submitted.
        status: {$ref: '#/components/schemas/TransferItemStatus'}
        vault_id:
          type: integer
          minimum: 1
          description: Vault the SOURCE asset is in after the operation (target for a completed move, unchanged otherwise).
        new_asset_id:
          type: [integer, 'null']
          minimum: 1
          description: Copy only. Id of the new independent asset when completed.
        revoked_share_count:
          type: integer
          minimum: 0
          description: Move only. Asset-scoped shares revoked with reason `moved`.
        error:
          oneOf:
            - $ref: '#/components/schemas/TransferItemError'
            - type: 'null'
        approval_request_id:
          type: [integer, 'null']
          minimum: 1
        approval_expires_at:
          type: [string, 'null']
          format: date-time
    TransferResponse:
      type: object
      additionalProperties: false
      required: [operation_id, results]
      properties:
        operation_id:
          type: string
          description: Opaque id of this operation (idempotency journal entry). Safe to log.
        results:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/TransferItemResult'}
