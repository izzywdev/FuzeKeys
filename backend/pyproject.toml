# Tool configuration for the FuzeKeys backend.
#
# Formatting/lint tooling is pinned in requirements.txt (black, isort, mypy).
# Keeping the settings here means `black --check` in CI and a developer's local
# run agree, instead of depending on each tool's shifting defaults.

[tool.black]
line-length = 88
# Pinned so output does not depend on which interpreter in the CI matrix
# (3.9 / 3.10 / 3.11) happens to run black.
target-version = ["py39"]

[tool.isort]
# Required: isort's default style disagrees with black and the two would
# fight each other across the two CI steps.
profile = "black"
line_length = 88

[tool.mypy]
ignore_missing_imports = true
# This codebase predates PEP 484's no-implicit-optional rule and is written
# throughout as `def f(x: str = None)`. Declaring that convention explicitly
# is more honest than annotating several hundred call sites as Optional.
implicit_optional = true

# --- mypy baseline -----------------------------------------------------------
# These modules predate any type checking and carry 0 pre-existing errors
# between them. mypy has never run to completion in CI (it aborted on a module
# resolution error before reaching them), so this is recorded debt, not a
# regression. Every other module -- and every new one -- is gated normally.
# Burn this list down a module at a time; do not add to it.
[[tool.mypy.overrides]]
module = [
    "app.automation.web_scraper",
    "app.broker.macaroons",
    "app.broker.service",
    "app.database",
    "app.integrations.google.backend.signup",
    "app.integrations.site.permit_io.apikey",
    "app.integrations.site.permit_io.models",
    "app.integrations.site.permit_io.signin",
    "app.integrations.site.permit_io.signup",
    "app.llm_scraper_service.infrastructure_apis.email_api",
    "app.llm_scraper_service.iteration_framework.improvement_engine",
    "app.llm_scraper_service.iteration_framework.validation_system",
    "app.llm_scraper_service.llm_integration.code_generator",
    "app.llm_scraper_service.llm_integration.llm_client",
    "app.llm_scraper_service.scraper_engine.executor",
    "app.main",
    "app.models.account",
    "app.models.site",
    "app.models.sms",
    "app.routers.accounts",
    "app.routers.auth",
    "app.routers.background",
    "app.routers.chat",
    "app.routers.credentials",
    "app.routers.google_integration",
    "app.routers.identities",
    "app.routers.infrastructure",
    "app.routers.llm_scraper",
    "app.routers.sites",
    "app.routers.sites_mock",
    "app.routers.sms",
    "app.services.background_service",
    "app.services.captcha_service",
    "app.services.email_service",
]
ignore_errors = true
