server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # MFE assets — served for FuzeFront module federation.
    # ^~ prefix stops nginx from matching the ~* \.js$ regex below, ensuring
    # CORS headers are applied to remoteEntry.js and all federation chunk imports.
    # s-maxage=0 tells Cloudflare CDN not to cache these (Cloudflare honours it);
    # no-store prevents both browser and CDN from caching.
    location ^~ /apps/fuzekeys/ {
        alias /usr/share/nginx/html/apps/fuzekeys/;
        add_header Access-Control-Allow-Origin "https://app.fuzefront.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, s-maxage=0" always;
        try_files $uri $uri/ =404;
    }

    # Standalone app (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache for versioned static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Allow embedding in the FuzeFront portal (iframe MFE). SAMEORIGIN would
    # block the iframe from app.fuzefront.com, so we use frame-ancestors instead.
    add_header Content-Security-Policy "frame-ancestors 'self' https://app.fuzefront.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
