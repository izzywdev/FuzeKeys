components:
  schemas:
    AccountCreate:
      properties:
        website_name:
          type: string
          title: Website Name
        website_url:
          type: string
          title: Website Url
        identity_id:
          type: integer
          title: Identity Id
        website_domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Website Domain
        account_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Type
          default: free
        signup_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Signup Method
          default: automated
        stages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stages
      additionalProperties: false
      type: object
      required:
      - website_name
      - website_url
      - identity_id
      title: AccountCreate
    AccountCredentialRequest:
      properties:
        identity_id:
          type: integer
          title: Identity Id
          description: ID of the identity that owns the account
          example: 1
        account_id:
          type: integer
          title: Account Id
          description: ID of the account to retrieve credentials for
          example: 1
        credential_types:
          items:
            type: string
          type: array
          title: Credential Types
          description: List of credential types to retrieve
          example:
          - email
          - password
      type: object
      required:
      - identity_id
      - account_id
      - credential_types
      title: AccountCredentialRequest
      description: Request model for retrieving stored account credentials
      example:
        account_id: 1
        credential_types:
        - email
        - password
        - api_key
        identity_id: 1
    AccountCredentialResponse:
      properties:
        account_id:
          type: integer
          title: Account Id
          description: ID of the account
        site_name:
          type: string
          title: Site Name
          description: Name of the website
        credentials:
          additionalProperties:
            type: string
          type: object
          title: Credentials
          description: Stored credentials
        last_used:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used
          description: Timestamp when credentials were last accessed
      type: object
      required:
      - account_id
      - site_name
      - credentials
      title: AccountCredentialResponse
      description: Response model for stored account credentials
      example:
        account_id: 1
        credentials:
          api_key: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          email: john.doe.1703123456@example.com
          password: JohnDoePass123!
        last_used: '2024-01-01T12:00:00Z'
        site_name: github
    AccountResponse:
      properties:
        id:
          type: integer
          title: Id
        website_name:
          type: string
          title: Website Name
        website_url:
          type: string
          title: Website Url
        identity_id:
          type: integer
          title: Identity Id
        identity_name:
          type: string
          title: Identity Name
        is_active:
          type: boolean
          title: Is Active
        signup_completed:
          type: boolean
          title: Signup Completed
        created_at:
          type: string
          format: date-time
          title: Created At
        stages:
          items:
            $ref: '#/components/schemas/StageStatusResponse'
          type: array
          title: Stages
      type: object
      required:
      - id
      - website_name
      - website_url
      - identity_id
      - identity_name
      - is_active
      - signup_completed
      - created_at
      - stages
