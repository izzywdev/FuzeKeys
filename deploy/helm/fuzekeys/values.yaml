# Default values for the FuzeKeys platform chart.
# Override per-environment via `-f values-<env>.yaml` (values-contabo.yaml is the
# ArgoCD-applied prod overlay).

# -----------------------------------------------------------------------------
# Global / shared settings
# -----------------------------------------------------------------------------
global:
  # Logical environment name; surfaced as ENVIRONMENT / app labels.
  environment: production
  # Image registry + repo prefix. The image helper composes
  # <imageRegistry>/<repository>:<tag>, so per-component `image.repository`
  # overrides MUST be a BARE path (e.g. "izzywdev/fuzekeys/backend") with NO
  # registry host — otherwise the registry is prefixed twice.
  imageRegistry: ghcr.io
  imageRepository: izzywdev/fuzekeys
  imagePullPolicy: IfNotPresent
  # Pull secret name(s). The SealedSecret `ghcr-pull-secret` provides the real
  # dockerconfigjson (see deploy/argocd/sealed/). Overridden in values-contabo.
  imagePullSecrets: []
  #  - name: ghcr-pull-secret
  # Node affinity target. On the shared cluster, app pods target nodes labelled
  # node-role=workload (the label deploy/terraform node requests set with
  # role=workload). Empty = no affinity (local/kind).
  nodeRole: ""

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# FuzeInfra connection contract (one-way dependency: FuzeKeys -> FuzeInfra).
#
# FuzeInfra is SHARED infrastructure (Postgres/Redis/...) owned by another team.
# FuzeKeys is a CONSUMER: the ONLY thing it assumes about FuzeInfra is its
# published Service contract — stable in-cluster Services named `fuzeinfra-<svc>`
# reachable at `fuzeinfra-<svc>.<namespace>.svc.cluster.local`.
#
# This block holds ONLY contract inputs (where to reach FuzeInfra) — never
# credentials. Credentials are FuzeKeys-owned and live in `secrets:` below (and
# in real clusters come from a SealedSecret); the connection URLs are composed
# in the Secret from those creds + this host/port contract.
#
#  - `namespace`        : the namespace FuzeInfra publishes its Services into.
#  - `useNamespacedDns` : true  -> build the in-cluster FQDN
#                                  `<host>.<namespace>.svc.cluster.local` (the
#                                  published contract; the main path).
#                         false -> compose-bridge FALLBACK: use raw `host` values
#                                  verbatim (docker-compose / out-of-cluster).
# -----------------------------------------------------------------------------
fuzeinfra:
  namespace: fuzeinfra
  useNamespacedDns: true
  postgres:
    host: fuzeinfra-postgres
    port: 5432
    # Postgres database FuzeKeys connects to — FuzeKeys-owned, provisioned by
    # FuzeInfra's DB onboarding (role + database `fuzekeys`).
    database: fuzekeys
  redis:
    host: fuzeinfra-redis
    port: 6379
    db: 0

# -----------------------------------------------------------------------------
# Application-wide (non-secret) config -> ConfigMap
# -----------------------------------------------------------------------------
config:
  logLevel: INFO
  environment: production
  # OpenAI model used by the signup-automation path (key is a secret).
  openaiModel: gpt-4
  # Browser automation defaults.
  browserHeadless: "True"
  # Public API base the SPA calls (same edge as the frontend). Note: React
  # REACT_APP_* vars are baked at BUILD time, so this runtime value is advisory
  # for the pre-built image; the real value must be baked at image build.
  apiBaseUrl: "https://api.keys.prod.fuzefront.com"

# -----------------------------------------------------------------------------
# Secrets — FUZEKEYS-OWNED credentials (NOT FuzeInfra's).
#
# In real clusters these come from a SealedSecret (secrets.existingSecret =
# fuzekeys-secrets, generated by .github/workflows/seal-secrets.yml). The values
# here are EMPTY placeholders that degrade clearly (the backend refuses to start
# without SECRET_KEY / CREDENTIAL_ENCRYPTION_KEY). NEVER commit real values.
# -----------------------------------------------------------------------------
secrets:
  # If set, the chart will NOT render its own Secret and will reference this one
  # (the SealedSecret-provided `fuzekeys-secrets`). This is the prod path.
  existingSecret: ""
  # Datastore credentials FuzeKeys uses to authenticate against FuzeInfra Postgres.
  postgresUsername: ""
  postgresPassword: ""
  redisPassword: ""
  # Application secrets (backend refuses to boot without SECRET_KEY /
  # CREDENTIAL_ENCRYPTION_KEY). CREDENTIAL_ENCRYPTION_KEY MUST be a valid Fernet
  # key (urlsafe-base64 of 32 bytes) — the backend validates it as such.
  secretKey: ""
  credentialEncryptionKey: ""
  masterKeySalt: ""
  openaiApiKey: ""

# -----------------------------------------------------------------------------
# Shared persistence for app logs/data (NOT datastores).
# Datastores live in FuzeInfra; these PVCs only hold app logs + captured data.
# -----------------------------------------------------------------------------
persistence:
  logs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi

# -----------------------------------------------------------------------------
# Ingress (frontend + backend API). Behind the shared Cloudflare Tunnel; CF
# terminates TLS at the edge, so the cluster is HTTP-only — NO cert-manager, NO
# in-cluster TLS. className/hosts overridden in values-contabo.yaml.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  annotations: {}
  tls:
    enabled: false
  hosts:
    - host: keys.prod.fuzefront.com
      service: frontend
      port: 80
      path: /
    - host: api.keys.prod.fuzefront.com
      service: backend
      port: 8002
      path: /

# -----------------------------------------------------------------------------
# federatedMount: the SAME-ORIGIN portal mount for the Module-Federation remote.
# This is a DIFFERENT surface from `ingress` above (the public keys.prod host
# for standalone/direct access): it exposes the frontend's already-built MFE
# assets under the FuzeFront HOST origin at /apps/fuzekeys/ so the portal shell
# imports remoteEntry.js same-origin — no iframe, no CORS, no mixed-content,
# sharing the host's React 19 singleton.
#
# MUST live in THIS chart, not FuzeFront's: a k8s Ingress can only reference a
# Service in its own namespace, and the frontend Service runs in the `fuzekeys`
# namespace (a separate Argo Application). The cluster-wide Traefik controller
# routes it by host across namespaces, so no FuzeInfra change is needed.
#
# PASS-THROUGH, not rewrite: frontend/nginx.conf already serves the MFE build
# under the /apps/fuzekeys/ prefix (frontend/vite.config.ts `base:
# '/apps/fuzekeys/'`, baked into the image at that path by frontend/Dockerfile),
# so Traefik forwards the path verbatim — deliberately NO strip-prefix
# middleware/annotation, matching FuzeX's federatedMount shape
# (deploy/helm/fuzex/templates/federated-mount-ingress.yaml).
#
# Disabled + hostless by default here: `host` is `required` in the template
# when enabled, so a hostless Ingress can never match every request and hijack
# the controller. Enabled with host: app.fuzefront.com in values-contabo.yaml
# (FuzeFront's EXISTING prod host — no new DNS needed).
federatedMount:
  enabled: false
  className: traefik
  host: ""
  annotations: {}
  path: /apps/fuzekeys

serviceAccount:
  create: true
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Per-component settings
# -----------------------------------------------------------------------------

# --- Backend: FastAPI (app.main:app), port 8002, /health. ------------------
backend:
  enabled: true
  image:
    repository: "" # defaults to <global.imageRepository>/backend
    tag: ""        # defaults to Chart.appVersion
  replicas: 2
  port: 8002
  # Uses the image's default CMD (uvicorn app.main:app --port 8002). Override
  # here only if you need a different entrypoint.
  command: []
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }
  probes:
    path: /health
  # Prometheus scrape of the backend (see observability annotations on the pod).
  metrics:
    enabled: true
    path: /metrics

# --- Migrate: alembic upgrade head, run as a pre-sync/pre-upgrade Job. ------
migrate:
  enabled: true
  # Uses the backend image; alembic.ini lives at /app/alembic.ini in that image.
  command: ["alembic", "upgrade", "head"]
  backoffLimit: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Frontend: React SPA on nginx. Container listens 3000 (frontend/nginx.conf);
#     the Service exposes port 80 -> targetPort 3000. -------------------------
frontend:
  enabled: true
  image:
    repository: "" # defaults to <global.imageRepository>/frontend
    tag: ""
  replicas: 2
  # containerPort — MUST match the port nginx listens on in the image (3000).
  port: 3000
  # Service port the Ingress routes to ("served on :80").
  servicePort: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# =============================================================================
# PII-TOKENIZER STACK
#
# FOLLOW-UP: enable after Vault-in-k8s design + security review.
# These components are authored in full so the chart is complete, but are gated
# OFF by default (and in values-contabo.yaml). The tokenizer stack requires a
# Vault-in-k8s auto-unseal design (Vault is sealed on every restart; the current
# init/unseal key lives in a local volume — NOT acceptable for k8s prod) plus a
# security review of the LLM data-path. Do NOT flip these on before that lands.
# Ollama stays disabled regardless (GPU/heavy).
# =============================================================================

# --- Tokenizer: FastAPI wrapper over pii_vault, port 8099, /health. ---------
tokenizer:
  enabled: false
  image:
    repository: "" # defaults to <global.imageRepository>/pii-tokenizer
    tag: ""
  replicas: 1
  port: 8099
  env:
    TOKEN_TTL: "86400"
    PII_ENTITIES: "CREDIT_CARD,US_SSN,EMAIL_ADDRESS,PHONE_NUMBER,IBAN_CODE"
    PII_SCORE_THRESHOLD: "0.4"
    MAX_TOKENIZE_CHARS: "20000"
    VAULT_TRANSIT_KEY: "pii"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Vault-bootstrap: one-shot Job (init once + unseal + ensure transit key). -
vaultBootstrap:
  enabled: false
  # Uses the pii-tokenizer image; command overrides the default tokenizer CMD.
  command: ["python", "service/vault_bootstrap.py"]
  env:
    VAULT_TRANSIT_KEY: "pii"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# --- Presidio analyzer: PII detection over HTTP, container port 3000. --------
presidio:
  enabled: false
  image: "mcr.microsoft.com/presidio-analyzer:latest"
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

# --- LiteLLM proxy: :4000 with the pii-tokenizer guardrail. ------------------
litellm:
  enabled: false
  image: "ghcr.io/berriai/litellm:main-stable"
  replicas: 1
  port: 4000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Vault: transit engine, PERSISTENT file storage. ------------------------
vault:
  enabled: false
  image: "hashicorp/vault:1.18"
  port: 8200
  # config.hcl is provided via the chart ConfigMap (see configmap.yaml).
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# --- Ollama: local Gemma second-stage PII detector. ALWAYS off (GPU/heavy). --
ollama:
  enabled: false
  image: "ollama/ollama:latest"
  port: 11434
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "2", memory: 6Gi }

# --- Redis: token store for the tokenizer stack (SEPARATE from FuzeInfra redis). -
tokenizerRedis:
  enabled: false
  image: "redis:7-alpine"
  port: 6379
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# -----------------------------------------------------------------------------
# MCP SSE gateway — FuzeKeys' THIRD pod.
#
# Runs the shared @fuzefront/mcp-gateway image (one image, one pod per product),
# configured with THIS product's OpenAPI document and API base URL. It holds no
# credential of its own and forwards the caller's Authorization header upstream,
# so every per-user check the backend makes still applies.
#
# Disabled by default: the gateway image must exist in the registry and the
# backend must be reachable at mcp.upstreamBaseUrl before this is worth
# scheduling. Enable it in the environment overlay (values-contabo.yaml).
# -----------------------------------------------------------------------------
mcp:
  enabled: false
  replicas: 1
  port: 8081
  # MCP server name reported to clients. Uses the DE-PREFIXED product slug, to
  # match registration/manifest.json.
  product: keys
  image:
    repository: ghcr.io/izzywdev/fuze-mcp-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Base URL of the FuzeKeys REST API. Empty = derive it from the in-cluster
  # backend Service (<fullname>-backend:<backend.port>), which is correct for
  # every normal deployment. The paths in contracts/openapi.yaml are absolute
  # (/api/v1/...), so this URL carries NO path prefix.
  upstreamBaseUrl: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# -----------------------------------------------------------------------------
# A2A — the product's FOURTH pod (backend, frontend, MCP, A2A).
#
# Runs ghcr.io/izzywdev/fuze-a2a: the shared agent-delegation runtime, ONE image
# for both the multi-tenant server and a per-product single-tenant pod like this
# one — they differ only in the mounted values document (this block). No
# FuzeKeys logic is baked into the image; everything that makes this pod "the
# FuzeKeys agent" is `tenants[0]` below plus this repo's own
# agent-templates/roles/keys-broker/role.json + .claude/skills/*.
#
# CORRECTION (2026-09-02, superseding an earlier "no pod here" design): a
# per-product pod's callable endpoint used to be a hardcoded constant in the
# image (agent-templates/a2a/card_generator.py), so a pod here would have
# booted healthy and advertised the SHARED server's address to every caller —
# functionally dead while looking fine. FuzeAgent's contract v1.2.0 (#148) made
# that endpoint read `a2a.inClusterUrl` below instead, which is what makes this
# pod reachable. Full history: docs/a2a-tenant-registration.md.
#
# STILL `enabled: false`. The remaining gates are OPERATIONAL, not
# architectural: (1) `a2a-provider-anthropic` is not yet sealed into this
# repo's own `fuzekeys` namespace (kubeseal is namespace-scoped; sealing is an
# operator step, never done from here), and (2) the fleet Anthropic workspace
# has separately reported a low credit balance. Flip this only once (1) is
# confirmed sealed — flipping it earlier schedules a pod that ImagePullBackOff
# or crash-loops for a reason nothing here makes visible.
#
# Every key under `a2a` is exactly the FROZEN values interface
# (FuzeAgent agent-templates/contracts/a2a/v1/schema/values-interface.schema.json),
# additionalProperties:false at every level — nothing here is invented. Pure
# deployment mechanics live in the sibling `a2aDeploy` block below, which the
# interface deliberately does not define.
# -----------------------------------------------------------------------------
a2a:
  # Gate 1 of 2 — `tenants[0].enabled` is the other, and both must be on.
  enabled: false
  image:
    repository: ghcr.io/izzywdev/fuze-a2a
    # Immutable tag, resolved against the GHCR registry (anonymous token +
    # manifest GET -> HTTP 200) before pinning, never assumed from a green
    # release. Never `latest` — templates/a2a.yaml refuses to render on
    # `latest` or an empty tag, because a moving tag makes the deployed server
    # unidentifiable.
    tag: d9edae9b4268
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  protocolVersion: "1.0"
  # ⇩ THE ONE VALUE A PER-PRODUCT POD MUST NOT GET WRONG (contract v1.2.0).
  # The server publishes this string VERBATIM as the card's AgentInterface.url,
  # so it must equal this chart's own A2A Service: templates/a2a.yaml renders a
  # fixed `a2a-fuzekeys` Service into the release namespace, and a render-time
  # guard there fails the chart if the two ever disagree. Leaving it unset does
  # not fail — it silently means the SHARED server, which is the whole trap.
  inClusterUrl: http://a2a-fuzekeys.fuzekeys.svc.cluster.local:8080/rpc
  # Machine-to-machine identity — NOT user identity. These authenticate other
  # AGENTS calling this surface. Values match FuzeAgent's a2a-shared
  # values-prod.yaml (the family convention); the issuer is FuzeFront's
  # Authentik and `callerClaim: repo` is the only trusted caller identity
  # (contracts/a2a/v1/authz.md §2).
  auth:
    oidcIssuerUrl: https://app.fuzefront.com/application/o/fuzefront/
    audience: a2a
    callerClaim: repo
    oidcDiscoveryUrl: http://authentik-server.fuzefront.svc.cluster.local:9000/application/o/fuzefront/.well-known/openid-configuration
    # mTLS is in-cluster defence-in-depth on top of the bearer. Off until an
    # `a2a-mtls-ca` SealedSecret exists in this namespace.
    mtls:
      enabled: false
  # EXACTLY ONE entry — a per-product pod serves a single tenant, and
  # templates/a2a.yaml refuses to render if more than one is enabled. The
  # projection inputs this names are real and verified: .fuze/manifest.json
  # carries a populated `providesTo` (18 entries; empty/absent would deny every
  # caller) and agent-templates/roles/keys-broker/role.json has a non-empty
  # `description` and a real `skills[]` (credential-broker-mediation,
  # fuzekeys-expert), both resolving to real .claude/skills/*/SKILL.md bundles.
  tenants:
    - tenant: FuzeKeys
      repo: izzywdev/FuzeKeys
      ref: master
      enabled: true
      entryRole: keys-broker
      external: false
      provider:
        name: anthropic
        # Not yet sealed (see the STILL enabled:false note above). Referencing
        # the name/key now, rather than after sealing, is deliberate: it is
        # what gate-a2a's --creds check is FOR — a secretRef that does not yet
        # resolve is a true, actionable finding, not something to hide by
        # leaving the field out until it's convenient.
        apiKeySecretRef: { name: a2a-provider-anthropic, key: api-key }

# Deployment mechanics for the A2A pod. Kept OUT of `a2a` so that block stays
# conformant to the frozen operator interface, which defines no templates.
a2aDeploy:
  replicas: 1
  agentProvider: anthropic
  gitImage: alpine/git:latest
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 896Mi
  # This repo is class: oss-public (.fuze/manifest.json), so the init
  # container's `git clone` of izzywdev/FuzeKeys needs no credential — null is
  # correct here, not a placeholder for a future secret. A private repo would
  # set { name: a2a-repos-git, key: token }.
  reposGitTokenSecretRef: null

# ---------------------------------------------------------------------------
# FuzeFront self-registration (docs/mfe-self-registration.md).
#
# Cluster-internal service DNS on purpose, per @fuzefront/onboarding-kit: the
# init container has no reason to leave the cluster, and the public ingress host
# may not resolve before ingress is ready. Override per-environment if the
# applications service moves.
# ---------------------------------------------------------------------------
fuzefront:
  apiUrl: "http://fuzefront-applications.fuzefront.svc.cluster.local:3003"
