{{- if and .Values.migrate.enabled .Values.backend.enabled }}
{{/*
  Alembic migration Job. Runs `alembic upgrade head` before backend pods start.
  Ordered via Argo sync-waves: ConfigMap at wave -2, this Job at wave -1,
  backend/frontend at wave 0 (default). Argo waits for each wave to reach
  Healthy before advancing, so migrations always complete before new pods roll out.
  Idempotent: `alembic upgrade head` is a no-op when the DB is already at head.

  Replace=true,Force=true is LOAD-BEARING, and BOTH halves are required.
  Replace=true alone was tried first (chart 0.1.12) and made things worse, which is
  worth recording so nobody retries it: Argo's Replace=true means `kubectl replace`,
  an IN-PLACE swap -- not delete-and-recreate. Replacing a Job still hits
  spec.template immutability, AND additionally fails on the selector, because
  Kubernetes auto-generates `spec.selector` with a controller-uid the chart does not
  declare:

      Job.batch "fuzekeys-migrate" is invalid: spec.selector: Required value,
      `selector` does not match template `labels`,
      spec.selector: Invalid value: null: field is immutable

  Force=true is what makes it `kubectl replace --force`, i.e. DELETE then recreate --
  which is the only operation that legally changes an immutable field. A Job's `spec.template` is
  immutable in Kubernetes, and `fuzekeys.labels` stamps `helm.sh/chart` and
  `app.kubernetes.io/version` onto the POD TEMPLATE -- so every chart version bump
  changes an immutable field. A server-side apply then fails with
  `Job.batch "fuzekeys-migrate" is invalid: spec.template: ... field is immutable`,
  Argo retries 5 times and the whole Application goes Degraded/OutOfSync. That is
  not an unlucky upgrade: it is guaranteed on EVERY release. It stuck prod from
  2026-08-24 (issue #110). Replace=true makes Argo delete and recreate the Job
  instead of patching it, which is legal precisely because the Job is idempotent.

  Why NOT a Helm hook, the way vault-bootstrap-job.yaml does it: Argo maps
  `helm.sh/hook: pre-upgrade` to PreSync, which runs before the ENTIRE sync --
  including before the wave -2 ConfigMap and the Secret this Job consumes via
  `envFrom`. The migration would then run against absent or stale config. The
  sync-wave ordering below (config -2 -> migrate -1 -> workloads 0) is the thing
  that makes the config available, so it has to stay.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fuzekeys.fullname" . }}-migrate
  labels:
    {{- include "fuzekeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fuzekeys.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- include "fuzekeys.nodeSelector" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "fuzekeys.image" (dict "ctx" . "comp" .Values.backend "default" "backend") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{ toJson .Values.migrate.command }}
          envFrom:
            - configMapRef:
                name: {{ include "fuzekeys.fullname" . }}-config
            - secretRef:
                name: {{ include "fuzekeys.secretName" . }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
