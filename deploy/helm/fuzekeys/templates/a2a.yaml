{{- if .Values.a2a.enabled }}
{{/*
FuzeKeys A2A server — the product's FOURTH pod (backend, frontend, MCP, A2A).

Runs the pre-built ghcr.io/izzywdev/fuzeagent-a2a image. Nothing in that image is
FuzeKeys-specific: the pod is "the FuzeKeys A2A server" purely because of the
values document mounted at /config/values.json and the repo checked out into
/repos, which is where the card projection reads .fuze/manifest.json and
agent-templates/roles/ from (FuzeAgent agent-templates/a2a/runtime.py,
LocalRepoResolver + loader.py).

The env surface below is EXACTLY the set the image declares
(agent-templates/a2a/Dockerfile): HOST, A2A_VALUES_FILE, A2A_REPOS_DIR,
AGENT_PROVIDER, FUZE_STATE_DIR. Nothing is invented — the listen port is NOT an
env var, the server reads it from the values file's service.port so the container
port and the served port cannot disagree.

>>> READ THIS BEFORE SETTING a2a.enabled: true <<<

1. THE FAMILY CONTRACT SAYS ONE SHARED A2A SERVER, NOT ONE PER PRODUCT.
   FuzeAgent's frozen values-interface and docs/a2a/enable-your-pod.md are
   explicit: "There is one shared A2A server for the whole family, not one
   deployment per product... onboarding is data, not a new chart." That shared
   deployment lives in FuzeAgent (deploy/helm/a2a-shared) and a product onboards
   by adding an `a2a.tenants[]` entry there.
   This chart deploys a DEDICATED FuzeKeys pod because the 4-pod target asks for
   one. It is compatible with the image and the values interface, but it is a
   deliberate divergence from the shared-server design and the owner should
   settle which one wins before either is enabled in production. Running both at
   once would serve the same tenant from two places.

2. PRECONDITIONS THIS REPO DOES NOT YET MEET (all fail CLOSED, none is invented
   here — they are the callee's own contract):
     a. `providesTo` in .fuze/manifest.json — PRESENT for FuzeKeys. Good: absent
        or empty means DENY every caller (authz.md §3).
     b. Every serving role needs a non-empty `description`. FuzeKeys'
        agent-templates/roles/keys-broker/role.json currently has `summary` but
        NO `description`, so the card projection FAILS rather than shipping a
        placeholder (card-projection.md §3). Fixing that is a2a-maintainer's
        call, not a chart change, so it is reported and not patched here.
     c. `a2a.auth.oidcIssuerUrl` and `a2a.cardSigning.keySecretRef` have no value
        that can be derived from this repo — the issuer is a cluster fact and the
        JWS signing key must come from a SealedSecret. They are REQUIRED below,
        so a misconfigured enable fails at template time rather than at runtime.
*/}}
{{- $tenant := .Values.a2a.tenant | default "FuzeKeys" }}
{{- $auth := required "a2a.auth is required when a2a.enabled — the server refuses to start without it (runtime.py build_from_env)" .Values.a2a.auth }}
{{- $_ := required "a2a.auth.oidcIssuerUrl is required when a2a.enabled" $auth.oidcIssuerUrl }}
{{- $_ := required "a2a.cardSigning.keySecretRef is required when a2a.enabled — the Fuze profile requires a signed Agent Card" (.Values.a2a.cardSigning).keySecretRef }}
{{/*
  The values document the server parses. Built ONCE here so the ConfigMap and the
  pod's roll-on-change checksum are derived from the same value — a checksum that
  re-renders the template would recurse into this file.
*/}}
{{- $doc := dict "a2a" (dict
    "enabled" true
    "protocolVersion" .Values.a2a.protocolVersion
    "service" (dict "type" "ClusterIP" "port" (.Values.a2a.service.port | int))
    "auth" $auth
    "cardSigning" .Values.a2a.cardSigning
    "tenants" (list (dict
        "tenant" $tenant
        "repo" .Values.a2a.repo
        "ref" .Values.a2a.ref
        "enabled" true
        "external" false
        "provider" .Values.a2a.provider
      ))
  ) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuzekeys.fullname" . }}-a2a-values
  labels:
    {{- include "fuzekeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
data:
  # The `a2a` block of FuzeAgent's frozen values-interface.schema.json, rendered
  # as JSON because that is what A2A_VALUES_FILE is parsed as (json.loads in
  # runtime._read_values). Secret VALUES never appear here — only secretRefs,
  # which the server resolves from mounted Secrets.
  values.json: |-
    {{ toJson $doc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuzekeys.fullname" . }}-a2a
  labels:
    {{- include "fuzekeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicas }}
  selector:
    matchLabels:
      {{- include "fuzekeys.selectorLabels" (dict "ctx" . "component" "a2a") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzekeys.labels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
      annotations:
        # A ConfigMap update alone does not restart a pod, and the values
        # document carries the tenant gate and the auth config.
        checksum/values: {{ toJson $doc | sha256sum }}
    spec:
      {{- include "fuzekeys.nodeSelector" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Matches the image's non-root USER 10001 (agent-templates/a2a/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        # runtime.LocalRepoResolver reads the tenant's projection inputs from
        # A2A_REPOS_DIR/<tenant>. The server's own comment says the checkout is
        # performed out of band by the chart, so it happens here — at the GitOps
        # `ref`, never live-mutated.
        - name: repo-sync
          image: {{ .Values.a2a.gitImage }}
          command:
            - sh
            - -c
            - |
              set -eu
              rm -rf "/repos/{{ $tenant }}"
              git clone --depth 1 --branch "{{ .Values.a2a.ref }}" \
                "https://github.com/{{ .Values.a2a.repo }}.git" "/repos/{{ $tenant }}"
          volumeMounts:
            - name: repos
              mountPath: /repos
      containers:
        - name: a2a
          image: "{{ .Values.a2a.image.repository }}:{{ .Values.a2a.image.tag }}"
          imagePullPolicy: {{ .Values.a2a.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.port }}
          env:
            # Bind all interfaces so the in-cluster Service can reach the pod;
            # the server defaults to loopback on purpose (CWE-605).
            - name: HOST
              value: "0.0.0.0"
            - name: A2A_VALUES_FILE
              value: /config/values.json
            - name: A2A_REPOS_DIR
              value: /repos
            - name: AGENT_PROVIDER
              value: {{ .Values.a2a.provider.name | quote }}
            - name: FUZE_STATE_DIR
              value: /state
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- with .Values.a2a.providerApiKeySecretRef }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
          volumeMounts:
            - name: values
              mountPath: /config
              readOnly: true
            - name: repos
              mountPath: /repos
            - name: state
              mountPath: /state
      volumes:
        - name: values
          configMap:
            name: {{ include "fuzekeys.fullname" . }}-a2a-values
        - name: repos
          emptyDir: {}
        # FUZE_STATE_DIR must be writable (in-flight session state), so emptyDir
        # rather than a read-only ConfigMap. Ephemeral is fine for v1.
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fuzekeys.fullname" . }}-a2a
  labels:
    {{- include "fuzekeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  # MUST be ClusterIP — ingress is Cloudflare-tunnel-only across the family.
  type: ClusterIP
  selector:
    {{- include "fuzekeys.selectorLabels" (dict "ctx" . "component" "a2a") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.a2a.service.port }}
      targetPort: http
{{- end }}
