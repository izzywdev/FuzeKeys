{{- if and .Values.vaultBootstrap.enabled .Values.vault.enabled }}
{{- $comp := .Values.vaultBootstrap -}}
{{/*
  One-shot Vault bootstrap: init (once) + unseal + ensure the transit key, then
  exits. Uses the pii-tokenizer image (command overrides the default CMD).

  This must be a normal Argo-managed Job, not a Helm post-install hook. Argo
  translates post-install to PostSync, while the backend requires the Secret
  created here before it can become Healthy; that creates a permanent rollout
  deadlock. The Job may start alongside Vault and retries until the Service is
  ready. Force+Replace reruns the idempotent bootstrap on every chart sync and
  avoids Kubernetes Job pod-template immutability on upgrades.
  FOLLOW-UP (Vault-in-k8s): the init file remains on the shared RWO PVC; replace
  this bootstrap unseal path with KMS/transit auto-unseal or an operator.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
  labels:
    {{- include "fuzekeys.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-bootstrap
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "fuzekeys.labels" . | nindent 8 }}
        app.kubernetes.io/component: vault-bootstrap
    spec:
      serviceAccountName: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
      restartPolicy: Never
      {{- include "fuzekeys.nodeSelector" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vault-bootstrap
          image: {{ include "fuzekeys.image" (dict "ctx" . "comp" .Values.tokenizer "default" "pii-tokenizer") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{ toJson $comp.command }}
          env:
            - name: VAULT_ADDR
              value: {{ printf "http://%s-vault:%v" (include "fuzekeys.fullname" .) .Values.vault.port | quote }}
            - name: VAULT_INIT_FILE
              value: "/init/.vault-init.json"
            - name: VAULT_RUNTIME_SECRET
              value: {{ printf "%s-vault-runtime" (include "fuzekeys.fullname" .) | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $k, $v := $comp.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          volumeMounts:
            - name: vault-init
              mountPath: /init
      volumes:
        - name: vault-init
          persistentVolumeClaim:
            claimName: {{ include "fuzekeys.fullname" . }}-vault-init
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-vault-runtime" (include "fuzekeys.fullname" .) | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fuzekeys.fullname" . }}-vault-bootstrap
{{- end }}
